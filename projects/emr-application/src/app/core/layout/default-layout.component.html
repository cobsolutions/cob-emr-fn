<!-- Loading Overlay -->
<div class="app-loading-overlay" *ngIf="isLoading">
  <div class="app-loading-content">
    <div class="app-loading-spinner">
      <div class="spinner-ring"></div>
      <div class="spinner-ring"></div>
      <div class="spinner-ring"></div>
    </div>
    <div class="app-loading-text">
      <span class="loading-title">Loading Application</span>
      <span class="loading-subtitle">Please wait while we prepare your workspace...</span>
    </div>
  </div>
</div>

<!--sidebar-->
<c-sidebar #sidebar1="cSidebar" class="d-print-none sidebar sidebar-fixed" id="sidebar1" colorScheme="light" visible *ngIf="!isLoading && !isPendingActivation">
  <c-sidebar-brand [routerLink]="['/emr/dashboard']" class="sidebar-brand-custom">
    <div class="sidebar-brand-full">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
           stroke="#0891B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
      </svg>
      <span class="brand-text">EMR<span class="brand-text-light">System</span></span>
    </div>
    <div class="sidebar-brand-narrow">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
           stroke="#0891B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
      </svg>
    </div>
  </c-sidebar-brand>


    <c-sidebar-nav *ngIf="navItems" [navItems]="navItems!"></c-sidebar-nav>


  <c-sidebar-toggler *ngIf="!sidebar1.narrow" toggle="unfoldable" cSidebarToggle="sidebar1"></c-sidebar-toggler>
</c-sidebar>

<!--aside-->
<!--main-->
<div class="wrapper d-flex flex-column min-vh-100 bg-light dark:bg-transparent" *ngIf="!isLoading">
  <!--app-header-->
  <app-header class="mb-4 d-print-none header header-sticky" position="sticky"
    sidebarId="sidebar1"></app-header>
  <!--app-body-->
  <div class="body flex-grow-1 px-3">
    <div class="container-fluid">

      <router-outlet></router-outlet>
    </div>
  </div>
  <!--app footer-->
  <app-default-footer></app-default-footer>
</div>
