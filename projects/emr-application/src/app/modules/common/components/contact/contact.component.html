<form cForm #contactForm="ngForm" (ngSubmit)="add()">

    <!-- Phone Information Section -->
    <div class="form-section">
        <div class="section-header">
            <span class="section-title">Phone Information</span>
        </div>
        <c-row class="mb-3">
            <c-col md="4">
                <label cLabel for="phoneType" class="form-label">Phone Type <span class="text-danger">*</span></label>
                <select cFormControl cSelect sizing="sm" id="phoneType" name="phoneType" required
                    [ngClass]="{'is-invalid': phoneType.invalid && (phoneType.dirty || phoneType.touched)}"
                    [(ngModel)]="contact.phoneType" #phoneType="ngModel">
                    <option [ngValue]="null" disabled selected>Select Type</option>
                    <option *ngFor="let phoneType of phoneTypes | keyvalue" [ngValue]="phoneType.key">
                        {{phoneType.value}}
                    </option>
                </select>
                <small *ngIf="phoneType.invalid && (phoneType.dirty || phoneType.touched)" class="text-danger">Required</small>
            </c-col>
            <c-col md="8">
                <label cLabel for="contactPhone" class="form-label">Phone Number <span class="text-danger">*</span></label>
                <div class="phone-input-wrapper">
                    <span class="input-prefix">+1</span>
                    <input cFormControl id="contactPhone" name="contactPhone" sizing="sm"
                        placeholder="(000) 000-0000" required
                        [ngClass]="{'is-invalid': contactPhone.invalid && (contactPhone.dirty || contactPhone.touched)}"
                        #contactPhone="ngModel" [ngModel]="contact.phoneNumber | phone"
                        (ngModelChange)="contact.phoneNumber=$event" maxlength="15"
                        class="prefixed-input" />
                </div>
                <small *ngIf="contactPhone.invalid && (contactPhone.dirty || contactPhone.touched)" class="text-danger">Required</small>
            </c-col>
        </c-row>
    </div>

    <!-- Email Section -->
    <div class="form-section">
        <div class="section-header">
            <span class="section-title">Email Address</span>
            <span class="section-optional">Optional</span>
        </div>
        <c-row class="mb-3">
            <c-col md="12">
                <label cLabel for="contactEmail" class="form-label">Email</label>
                <div class="email-input-wrapper">
                    <span class="input-prefix">@</span>
                    <input type="email" cFormControl id="contactEmail" name="contactEmail" sizing="sm"
                        placeholder="email@example.com"
                        #contactEmail="ngModel" [(ngModel)]="contact.email"
                        class="prefixed-input" />
                </div>
            </c-col>
        </c-row>
    </div>

    <!-- Additional Info Section -->
    <div class="form-section">
        <div class="section-header">
            <span class="section-title">Additional Information</span>
            <span class="section-optional">Optional</span>
        </div>
        <c-row class="mb-3">
            <c-col md="12">
                <textarea cFormControl id="contactAddInfo" name="contactAddInfo" sizing="sm" rows="2"
                    placeholder="Enter any additional contact notes..."
                    #contactAddInfo="ngModel" [(ngModel)]="contact.additionalInfo"></textarea>
            </c-col>
        </c-row>
        <div class="action-row">
            <button cButton class="add-btn" type="button" (click)="add()">
                <svg cIcon name="cilPlus" class="btn-icon"></svg>
                Add Contact
            </button>
        </div>
    </div>
</form>

<!-- Added Contacts Table -->
<div class="contacts-list" *ngIf="contacts && contacts.length > 0">
    <div class="list-header">
        <span class="list-title">Added Contacts</span>
        <span class="list-count">{{contacts.length}} contact(s)</span>
    </div>
    <div class="table-responsive">
        <table class="contacts-table">
            <thead>
                <tr>
                    <th class="col-index">#</th>
                    <th class="col-type">Type</th>
                    <th class="col-phone">Phone</th>
                    <th class="col-email">Email</th>
                    <th class="col-actions">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let contact of contacts; let i = index;">
                    <td class="col-index">{{i + 1}}</td>
                    <td class="col-type">
                        <span class="type-badge">{{contact.phoneType}}</span>
                    </td>
                    <td class="col-phone">
                        <div class="phone-display">
                            <svg cIcon name="cilPhone" class="contact-icon"></svg>
                            {{contact.phoneNumber}}
                        </div>
                    </td>
                    <td class="col-email">
                        <div class="email-display">
                            <svg cIcon name="cilEnvelopeClosed" class="contact-icon"></svg>
                            {{contact.email}}
                        </div>
                    </td>
                    <td class="col-actions">
                        <button cButton class="delete-btn" (click)="remove(i)" title="Remove">
                            <svg cIcon name="cilTrash"></svg>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Empty State -->
<div class="empty-state" *ngIf="!contacts || contacts.length === 0">
    <svg cIcon name="cilPhone" class="empty-icon"></svg>
    <p class="empty-text">No contacts added yet</p>
</div>
