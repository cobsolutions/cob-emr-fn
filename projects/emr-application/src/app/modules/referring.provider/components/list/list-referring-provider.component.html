<ngx-spinner type="ball-scale-multiple"></ngx-spinner>
<c-row>
  <c-col xs="12" class="mb-2">
    <h1>Clinics</h1>
  </c-col>
</c-row>
<hr />
<div class="d-grid gap-2 d-md-flex justify-content-md-end">
  <button cButton color="primary" class="me-md-2" variant="outline" (click)="create()">Create Referring
    Provider</button>
</div>

<ng-container *ngIf="props$ | async as props" fluid="true">
  <c-smart-table [columnSorter]="{resetable: true }" [columns]="columns" [items]="(referringProvider$ | async) ?? []"
    [itemsPerPage]="props.itemsPerPage" (itemsPerPageChange)="handleItemsPerPageChange($event)"
    [itemsPerPageOptions]="[5,10,20]" [itemsPerPageSelect]="true"
    [tableProps]="{ hover: true, striped: true, responsive: true , small:true }"
    [columnFilterValue]="props.columnFilterValue?? []" [sorterValue]="props.sorterValue"
    [tableProps]="{ hover: true, striped: true, responsive: true }" [tableBodyProps]="{ align: 'middle' }"
    (sorterValueChange)="handleSorterValueChange($event)" header>
    <ng-template cTemplateId="tableData" let-columnName="columnName" let-item="item" let-tdContent="tdContent">
      <td>
        <ng-container [ngSwitch]="columnName">
          <ng-container *ngSwitchCase="'actions'" class="py-2">
            <div class="btn-group" role="group" aria-label="Basic example">
              <button cButton variant="outline" (click)="remove(item)" size="sm">
                <svg cIcon name="cilTrash"></svg>
              </button>
              <button cButton variant="outline" (click)="edit(item)" size="sm">
                <svg cIcon name="cilPen"></svg>
              </button>
            </div>
          </ng-container>
          <ng-container *ngSwitchDefault>
            {{tdContent}}
          </ng-container>
        </ng-container>
      </td>
    </ng-template>
  </c-smart-table>
  <c-smart-pagination *ngIf="props.totalPages" [activePage]="props.activePage"
    (activePageChange)="handleActivePageChange($event)" [pages]="props.totalPages"></c-smart-pagination>
</ng-container>
<c-modal id="addReferringProvider" [visible]="addReferringProviderVisibility" size="xl">
  <c-modal-header>
    <h3 cModalTitle>Add Referring Provider</h3>
    <button (click)="toggleReferringProvider()" cButtonClose></button>
  </c-modal-header>
  <c-modal-body>
    <create-referring-provider [mode]="'create'" (changeVisibility)="changeVisibility($event)"></create-referring-provider>
  </c-modal-body>
</c-modal>
