<ngx-spinner></ngx-spinner>

<!-- Main Form Content -->
<div class="form-container">
  <form cForm #referringProviderCreateForm="ngForm" (ngSubmit)="submit()">

    <!-- Provider Information -->
    <c-card class="section-card">
      <div class="card-header-custom" [ngClass]="{'invalid': !referringProviderCreateForm.valid}">
        <div class="card-header-title">
          <svg cIcon name="cilUser" class="card-icon"></svg>
          <span>Provider Information</span>
        </div>
        <span class="card-status" *ngIf="!referringProviderCreateForm.valid">
          <svg cIcon name="cilWarning" class="status-icon"></svg>
          Required
        </span>
        <span class="card-status valid" *ngIf="referringProviderCreateForm.valid">
          <svg cIcon name="cilCheckCircle" class="status-icon"></svg>
          Complete
        </span>
      </div>
      <c-card-body class="card-body-custom">
        <c-row>
          <c-col xs="12" sm="6" class="mb-3">
            <label class="form-label" for="fname">
              First Name <span class="required-mark">*</span>
            </label>
            <input cFormControl id="fname" name="fname" placeholder="Enter first name" required
              [ngClass]="{'is-invalid': fname.invalid && (fname.dirty || fname.touched)}"
              #fname="ngModel" [(ngModel)]="referringProvider.firstName" />
            <small *ngIf="fname.invalid && (fname.dirty || fname.touched)" class="field-error">
              <svg cIcon name="cilWarning" class="field-error-icon"></svg>
              First Name is required
            </small>
          </c-col>
          <c-col xs="12" sm="6" class="mb-3">
            <label class="form-label" for="lname">
              Last Name <span class="required-mark">*</span>
            </label>
            <input cFormControl id="lname" name="lname" placeholder="Enter last name" required
              [ngClass]="{'is-invalid': lname.invalid && (lname.dirty || lname.touched)}"
              #lname="ngModel" [(ngModel)]="referringProvider.lastName" />
            <small *ngIf="lname.invalid && (lname.dirty || lname.touched)" class="field-error">
              <svg cIcon name="cilWarning" class="field-error-icon"></svg>
              Last Name is required
            </small>
          </c-col>
        </c-row>
        <c-row>
          <c-col xs="12" sm="6" class="mb-3">
            <label class="form-label" for="referringProvidernpi">
              NPI
              <span class="optional-mark">Optional</span>
            </label>
            <input cFormControl id="referringProvidernpi" name="npi" placeholder="Enter NPI number"
              [(ngModel)]="referringProvider.npi" #npi="ngModel" />
          </c-col>
        </c-row>
      </c-card-body>
    </c-card>

    <!-- Action Section -->
    <div class="action-section">
      <button *appRoleScope="'emr-referring-provider-role'; requireModify: true"
        cButton class="create-btn" type="submit" [disabled]="!referringProviderCreateForm.valid">
        <svg cIcon name="cilCheckCircle" class="btn-icon"></svg>
        <span *ngIf="mode === 'create'">Create Referring Provider</span>
        <span *ngIf="mode === 'update'">Update Referring Provider</span>
      </button>
    </div>

  </form>
</div>
