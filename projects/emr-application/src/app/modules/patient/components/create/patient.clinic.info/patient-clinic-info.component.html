<c-multi-select multiple [(ngModel)]="patient!.clinicsId" placeholder="Select Clinic(s)" *ngIf="clinics"
    disable-multi-select [componentRole]="componentRole">
    <c-multi-select-option *ngFor="let clinic of clinics " [value]="clinic.id" [selected]="clinic.selected"
        [disabled]="clinic.selected">
        {{clinic.name}}</c-multi-select-option>
</c-multi-select>
