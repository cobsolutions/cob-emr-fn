<form cForm #patientBasicInfoForm="ngForm">

    <!-- Personal Identity Section -->
    <div class="form-section">
        <div class="section-header">
            <span class="section-title">Personal Identity</span>
        </div>
        <c-row class="mb-3">
            <c-col md="2">
                <label cLabel for="title" class="form-label">Title</label>
                <select cFormControl cSelect sizing="sm" id="title" name="title"
                    [(ngModel)]="patient.title" #title="ngModel">
                    <option [ngValue]="null" disabled selected>Select</option>
                    <option *ngFor="let titleValue of titles | keyvalue" [value]="titleValue.key">
                        {{titleValue.value}}
                    </option>
                </select>
            </c-col>
            <c-col md="3">
                <label cLabel for="firstName" class="form-label">First Name <span class="text-danger">*</span> <small *ngIf="firstName.invalid && (firstName.dirty || firstName.touched)" class="text-danger">Required</small></label>
                <input cFormControl id="firstName" name="firstName" sizing="sm" placeholder="First name" required
                    [ngClass]="{'is-invalid': firstName.invalid && (firstName.dirty || firstName.touched)}"
                    [(ngModel)]="patient.firstName" #firstName="ngModel" />
            </c-col>
            <c-col md="3">
                <label cLabel for="middleName" class="form-label">Middle Name</label>
                <input cFormControl id="middleName" name="middleName" sizing="sm" placeholder="Middle name"
                    [(ngModel)]="patient.middleName" #middleName="ngModel" />
            </c-col>
            <c-col md="3">
                <label cLabel for="lastName" class="form-label">Last Name <span class="text-danger">*</span> <small *ngIf="lastName.invalid && (lastName.dirty || lastName.touched)" class="text-danger">Required</small></label>
                <input cFormControl id="lastName" name="lastName" sizing="sm" placeholder="Last name" required
                    [ngClass]="{'is-invalid': lastName.invalid && (lastName.dirty || lastName.touched)}"
                    [(ngModel)]="patient.lastName" #lastName="ngModel" />
            </c-col>
            <c-col md="1">
                <label cLabel for="suffix" class="form-label">Suffix</label>
                <select cFormControl cSelect sizing="sm" id="suffix" name="suffix"
                    [(ngModel)]="patient.suffix" #suffix="ngModel">
                    <option [ngValue]="null" disabled selected>-</option>
                    <option *ngFor="let suffixValue of suffixes | keyvalue" [value]="suffixValue.key">
                        {{suffixValue.value}}
                    </option>
                </select>
            </c-col>
        </c-row>
    </div>

    <!-- Demographics Section -->
    <div class="form-section">
        <div class="section-header">
            <span class="section-title">Demographics</span>
        </div>
        <c-row class="mb-3">
            <c-col md="3">
                <label cLabel for="birthDate" class="form-label">Date of Birth <span class="text-danger">*</span></label>
                <c-date-picker cFormControl closeOnSelect size="sm" placeholder="MM/DD/YYYY" id="birthDate"
                    name="birthDate" required [(date)]="patient.birthDate_date"></c-date-picker>
            </c-col>
            <c-col md="3">
                <label cLabel for="gender" class="form-label">Gender <span class="text-danger">*</span> <small *ngIf="gender.invalid && (gender.dirty || gender.touched)" class="text-danger">Required</small></label>
                <select cFormControl cSelect sizing="sm" id="gender" name="gender" required
                    [ngClass]="{'is-invalid': gender.invalid && (gender.dirty || gender.touched)}"
                    [(ngModel)]="patient.gender" #gender="ngModel">
                    <option [ngValue]="null" disabled selected>Select Gender</option>
                    <option *ngFor="let ddd of genderKeys(genders)" [ngValue]="ddd">
                        {{genders[ddd]}}
                    </option>
                </select>
            </c-col>
            <c-col md="3">
                <label cLabel for="MaritalStatus" class="form-label">Marital Status</label>
                <select cFormControl cSelect sizing="sm" id="MaritalStatus" name="MaritalStatus"
                    [(ngModel)]="patient.maritalStatus" #maritalStatus="ngModel">
                    <option [ngValue]="null" disabled selected>Select Status</option>
                    <option *ngFor="let maritalStatusValue of maritalStatusKeys(maritalStatuses)" [ngValue]="maritalStatusValue">
                        {{maritalStatuses[maritalStatusValue]}}
                    </option>
                </select>
            </c-col>
            <c-col md="3">
                <label cLabel for="employerName" class="form-label">Employer</label>
                <input cFormControl id="employerName" name="employerName" sizing="sm" placeholder="Employer name"
                    #employerName="ngModel" [(ngModel)]="patient.employerName" />
            </c-col>
        </c-row>
    </div>

    <!-- Dependent Section -->
    <div class="form-section">
        <div class="section-header">
            <span class="section-title">Dependent Status</span>
            <c-form-check [switch]="true" class="section-toggle">
                <input cFormCheckInput type="checkbox" [(ngModel)]="patient.isDependent" name="isDependent"/>
                <label cFormCheckLabel>Is Dependent</label>
            </c-form-check>
        </div>

        <div *ngIf="patient.isDependent" class="dependent-fields">
            <c-row class="mb-3">
                <c-col md="6">
                    <label cLabel for="dependentName" class="form-label">Dependent Name <span class="text-danger">*</span> <small *ngIf="dependentName.invalid && (dependentName.dirty || dependentName.touched)" class="text-danger">Required</small></label>
                    <input cFormControl id="dependentName" name="dependentName" sizing="sm" placeholder="Full name"
                        required [ngClass]="{'is-invalid': dependentName.invalid && (dependentName.dirty || dependentName.touched)}"
                        #dependentName="ngModel" [(ngModel)]="patient.dependent.name" />
                </c-col>
                <c-col md="6">
                    <label cLabel for="dependentPhone" class="form-label">Dependent Phone <span class="text-danger">*</span> <small *ngIf="dependentPhone.invalid && (dependentPhone.dirty || dependentPhone.touched)" class="text-danger">Required</small></label>
                    <div class="phone-input-wrapper">
                        <span class="phone-prefix">+1</span>
                        <input cFormControl id="dependentPhone" name="dependentPhone" sizing="sm"
                            placeholder="(000) 000-0000" required
                            [ngClass]="{'is-invalid': dependentPhone.invalid && (dependentPhone.dirty || dependentPhone.touched)}"
                            #dependentPhone="ngModel" [ngModel]="patient.dependent.phone | phone"
                            (ngModelChange)="patient.dependent.phone=$event" maxlength="15"
                            class="phone-input" />
                    </div>
                </c-col>
            </c-row>
            <app-single-address [address]="patient.dependent.address"></app-single-address>
        </div>
    </div>

    <!-- Additional Notes Section -->
    <div class="form-section">
        <div class="section-header">
            <span class="section-title">Additional Notes</span>
            <span class="section-optional">Optional</span>
        </div>
        <c-row>
            <c-col md="12">
                <textarea cFormControl id="addtionalInfo" name="addtionalInfo" sizing="sm" rows="2"
                    placeholder="Enter any additional information or notes about the patient..."
                    #addtionalInfo="ngModel" [(ngModel)]="patient.addtionalInfo"></textarea>
            </c-col>
        </c-row>
    </div>
</form>
