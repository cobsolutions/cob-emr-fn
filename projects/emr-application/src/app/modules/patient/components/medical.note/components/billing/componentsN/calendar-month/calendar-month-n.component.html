<div class="direct-timed-code-container" [formGroup]="CalendarMonthForm">
  <div class="direct-timed-code-list">
      <div *ngFor="let code of billingCPTCodeList" class="direct-timed-code-item">
          <div class="input-row">
              <input
                type="number"
                [id]="'direct-timed-' + code.cpt"
                [formControlName]="code.cpt"
                class="form-control direct-timed-input"
                min="0"
                placeholder="0"
              />
              <label
                [for]="'direct-timed-' + code.cpt"
                class="direct-timed-label"
                [title]="'CPT Code: ' + code.cpt"
              >
                {{ code.description }}
              </label>
          </div>

          <div *ngIf="hasValue(code.cpt)" class="notes-wrapper">
              <textarea
                [id]="'notes-' + code.cpt"
                [formControlName]="code.cpt + '_notes'"
                placeholder="Enter notes for {{ code.cpt }}"
                rows="3"
                class="form-control"
              ></textarea>
          </div>
      </div>
  </div>
</div>
