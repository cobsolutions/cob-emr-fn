<div [formGroup]="formGroup">
  <!-- Apply to All -->
  <div *ngIf="showApplyToAll" style="margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem;">
    <label style="min-width: 150px; text-align: right; font-weight: 500; color: #5c4742;">{{ applyToAllLabel }}</label>
    <select cSelect style="max-width: 200px;" [formControlName]="getApplyToAllFieldName()">
      <option value="" selected>Select...</option>
      <option *ngFor="let option of measurementOptions" [value]="option.value">
        {{ option.label }}
      </option>
    </select>
  </div>

  <!-- Measurement & Endfeel Table -->
  <table class="walk-test-table">
    <thead>
      <tr>
        <th style="width: 300px;"></th>
        <th style="width: 200px;">Measurement</th>
        <th style="width: 200px;">Endfeel</th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngFor="let label of labels">
        <!-- Right side -->
        <tr>
          <td>{{ label }} (Right)</td>
          <td>
            <select cSelect class="table-input" [formControlName]="getMeasurementFieldName(label, 'right')">
              <option *ngFor="let option of measurementOptions" [value]="option.value">
                {{ option.label }}
              </option>
            </select>
          </td>
          <td>
            <select cSelect class="table-input" [formControlName]="getEndfeelFieldName(label, 'right')">
              <option *ngFor="let option of endfeelOptions" [value]="option.value">
                {{ option.label }}
              </option>
            </select>
          </td>
        </tr>
        <!-- Left side -->
        <tr>
          <td>{{ label }} (Left)</td>
          <td>
            <select cSelect class="table-input" [formControlName]="getMeasurementFieldName(label, 'left')">
              <option *ngFor="let option of measurementOptions" [value]="option.value">
                {{ option.label }}
              </option>
            </select>
          </td>
          <td>
            <select cSelect class="table-input" [formControlName]="getEndfeelFieldName(label, 'left')">
              <option *ngFor="let option of endfeelOptions" [value]="option.value">
                {{ option.label }}
              </option>
            </select>
          </td>
        </tr>
      </ng-container>
    </tbody>
  </table>

  <!-- Comments -->
  <div *ngIf="showComments" style="margin-top: 1rem;">
    <label style="font-weight: 500; color: #5c4742; display: block; margin-bottom: 0.5rem;">{{ commentsLabel }}</label>
    <textarea
      class="form-textarea"
      [formControlName]="getCommentsFieldName()"
      rows="3"
      placeholder="Enter any comments...">
    </textarea>
  </div>
</div>
