<div [formGroup]="form" class="billing-cpt-container">
  <div class="input-wrapper" title="Billing code: {{ cpt }}">
    <input 
      type="number" 
      formControlName="quantity" 
      min="0"
      class="quantity-input" 
      
    />
    <label class="label-text">{{ label }}</label>
  </div>

  <textarea 
    *ngIf="form.get('quantity')?.value" 
    formControlName="description"
    class="description-box">
  </textarea>
</div>
