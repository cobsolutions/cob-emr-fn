<div [formGroup]="formGroup">
  <!-- Top Selects Section -->
  <div class="top-selects-container">
    <div class="select-item" *ngFor="let select of topSelects">
      <label class="select-label">{{ select.label }}</label>
      <select cSelect class="select-input" [formControlName]="select.fieldName">
        <option value="" selected>Select...</option>
        <option *ngFor="let option of select.options" [value]="option.value">
          {{ option.label }}
        </option>
      </select>
    </div>
  </div>

  <!-- Measurement Table -->
  <table class="walk-test-table">
    <thead>
      <tr>
        <th style="width: 300px;"></th>
        <th style="width: 200px;">Right</th>
        <th style="width: 200px;">Left</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let label of labels">
        <td>{{ label }}</td>
        <td>
          <select cSelect class="table-input" [formControlName]="getFieldName(label, 'right')">
            <option *ngFor="let option of options" [value]="option.value">
              {{ option.label }}
            </option>
          </select>
        </td>
        <td>
          <select cSelect class="table-input" [formControlName]="getFieldName(label, 'left')">
            <option *ngFor="let option of options" [value]="option.value">
              {{ option.label }}
            </option>
          </select>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Comments -->
  <div *ngIf="showComments" style="margin-top: 1rem;">
    <label style="font-weight: 500; color: #5c4742; display: block; margin-bottom: 0.5rem;">{{ commentsLabel }}</label>
    <textarea
      class="form-textarea"
      [formControlName]="getCommentsFieldName()"
      rows="3"
      placeholder="Enter any comments...">
    </textarea>
  </div>
</div>
