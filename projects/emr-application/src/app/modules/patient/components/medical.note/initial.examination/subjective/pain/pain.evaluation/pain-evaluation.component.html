<div class="border p-3 rounded d-inline-block">
  <!-- Pain location-->
  <div class="d-flex align-items-center mb-3">
    <label for="init_date" class="me-2 text-end" style="white-space: nowrap; min-width: 190px;">
      Pain Location:
    </label>
    <input cFormControl sizing="sm" style="max-width: 190px;">
  </div>
  <!--Pain Scale-->
  <div class="d-flex align-items-center mb-3">
    <label for="init_date" class="me-2 text-end" style="white-space: nowrap; min-width: 190px;">
    </label>
    <table class="table borderless small-table">
      <thead>
        <tr>
          <th class="text-end gray-text" colspan="100%">0 = None &nbsp;&nbsp; 5 = Moderate &nbsp;&nbsp; 10 = Extreme
          </th>
        </tr>
        <tr>
          <th></th>
          <th *ngFor="let number of numbers" class="text-center small-text">{{ number }}</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="small-text">At worst</td>
          <td *ngFor="let number of numbers" class="radio-cell">
            <c-form-check class="d-flex justify-content-center">
              <input cFormCheckInput type="radio" [value]="number" name="atWorst" />
            </c-form-check>
          </td>
        </tr>
        <tr>
          <td class="small-text">Current</td>
          <td *ngFor="let number of numbers" class="radio-cell">
            <c-form-check class="d-flex justify-content-center">
              <input cFormCheckInput type="radio" [value]="number" name="current" />
            </c-form-check>
          </td>
        </tr>
        <tr>
          <td class="small-text">At best</td>
          <td *ngFor="let number of numbers" class="radio-cell">
            <c-form-check class="d-flex justify-content-center">
              <input cFormCheckInput type="radio" [value]="number" name="atBest" />
            </c-form-check>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <!--Pain Description-->
  <div class="d-flex align-items-center mb-3">
    <label for="init_date" class="me-2 text-end" style="white-space: nowrap; min-width: 190px;">
      Pain Description:
    </label>
    <select cSelect sizing="sm" style="max-width: 190px;">
      <option *ngFor="let description of descriptions" [value]="description">
        {{description}}
      </option>
    </select>
  </div>
  <!--Pain Follow-up Plan-->
  <div class="d-flex align-items-center mb-3">
    <label for="init_date" class="me-2 text-end" style="white-space: nowrap; min-width: 190px;">
      Pain Follow-up Plan:
    </label>
    <input cFormControl sizing="sm" style="max-width: 190px;">
  </div>
  <div class="mt-2">
    <p><a class="link-opacity-100" (click)="remove()" style="cursor: pointer;">Remove</a></p>
  </div>
</div>
