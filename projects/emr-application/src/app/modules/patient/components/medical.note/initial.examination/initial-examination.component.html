<ngx-spinner></ngx-spinner>
<c-container fluid="true" *ngIf="isLoaded">
    <div class="button-container m-2">
        <!-- <button (click)="backtoPatientRecordActions()" class="btn btn-link">Back to patient records</button> -->
        <c-input-group class="mb-3" style="max-width: 225px;">
            <select id="soapActionList" #soapActionList cSelect sizing="sm">
                <option value="back">Back to patient records</option>
                <option value="draft">Save as draft</option>
            </select>
            <button cButton color="primary" variant="outline" size="sm" (click)="soapActions(soapActionList.value)">
                <svg cIcon name="cilArrowCircleRight"></svg>
            </button>
        </c-input-group>
    </div>
    <form [formGroup]="initialExaminationForm" *ngIf="initialExaminationForm">
        <mat-stepper linear="true" #stepper [orientation]="stepperOrientation" (selectionChange)="onStepChange($event)">
            <!-- subjective step -->
            <mat-step [stepControl]="initialExaminationForm.get('subjective')!" completed="true"
                formGroupName="subjective">
                <ng-template matStepLabel>Subjective</ng-template>
                <subjective [stepper]="stepper" (formReady)="setChildForm('subjective', $event)"
                    [subjectiveData]="medicalNoteSOAP?.subjective" *ngIf="visitedSteps[0]"
                    [noteType]="'InitialExamination'">
                </subjective>
            </mat-step>
            <!-- objective step -->
            <mat-step completed="true" [stepControl]="initialExaminationForm.get('objective')!"
                formGroupName="objective">
                <ng-template matStepLabel>Objective</ng-template>
                <objective [stepper]="stepper" *ngIf="visitedSteps[1]" (formReady)="setChildForm('objective', $event)"
                    [objectiveData]="medicalNoteSOAP?.objective" [noteType]="'InitialExamination'"></objective>
            </mat-step>
            <!-- Assessment Step -->
            <mat-step completed="true" formGroupName="objective"
                [stepControl]="initialExaminationForm.get('assessment')!" formGroupName="assessment">
                <ng-template matStepLabel>Assessment</ng-template>
                <assessment [stepper]="stepper" (formReady)="setChildForm('assessment', $event)" *ngIf="visitedSteps[2]"
                    [assessmentData]="medicalNoteSOAP?.assessment" [noteType]="'InitialExamination'"></assessment>
            </mat-step>
            <!-- Plan Step -->
            <mat-step completed="true" [stepControl]="initialExaminationForm.get('planOfCare')!"
                formGroupName="planOfCare">
                <ng-template matStepLabel>Plan</ng-template>
                <plan [stepper]="stepper" (formReady)="setChildForm('planOfCare', $event)" *ngIf="visitedSteps[3]"
                    [planData]="medicalNoteSOAP?.planOfCare" [noteType]="'InitialExamination'">
                </plan>
            </mat-step>
            <!-- Billing Step -->
            <mat-step completed="true" [stepControl]="initialExaminationForm.get('billing')!" formGroupName="billing">
                <ng-template matStepLabel>Billing</ng-template>
                <billing-n [stepper]="stepper" [parentForm]="initialExaminationForm"
                    (formReady)="setChildForm('billing', $event)" *ngIf="visitedSteps[4] "
                    [noteTypeId]="'InitialExamination'" [caseId]="caseId" [medicalNoteId]="medicalNoteId"></billing-n>
            </mat-step>
        </mat-stepper>
    </form>

    <!-- Scroll Arrows -->
    <div class="scroll-arrow-container" *ngIf="showScrollArrow">
        <!-- Scroll Up Arrow -->
        <div class="scroll-arrow scroll-up" *ngIf="showUpArrow" (click)="scrollPageUp()" title="Scroll Up One Page">
            <div class="arrow-circle">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </div>
            <span class="arrow-label">Up</span>
        </div>

        <!-- Scroll Down Arrow -->
        <div class="scroll-arrow scroll-down" *ngIf="showDownArrow" (click)="scrollPageDown()" title="Scroll Down One Page">
            <div class="arrow-circle">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>
            <span class="arrow-label">Down</span>
        </div>
    </div>
</c-container>
