<c-container fluid="true">
    <form [formGroup]="initialExaminationForm">
        <mat-stepper linear="true" #stepper [orientation]="stepperOrientation" (selectionChange)="onStepChange($event)">
            <mat-step [stepControl]="initialExaminationForm.get('subjective')!" formGroupName="subjective"
                completed="false">
                <ng-template matStepLabel>Subjective</ng-template>
            </mat-step>
            <mat-step [stepControl]="initialExaminationForm.get('objective')!" formGroupName="objective"
                completed="false">
                <ng-template matStepLabel>Objective</ng-template>
            </mat-step>
            <mat-step [stepControl]="initialExaminationForm.get('assessment')!" formGroupName="assessment"
                completed="false">
                <ng-template matStepLabel>Assessment</ng-template>
            </mat-step>
            <mat-step [stepControl]="initialExaminationForm.get('plan')!" formGroupName="plan" completed="false">
                <ng-template matStepLabel>Plan</ng-template>
            </mat-step>
            <mat-step [stepControl]="initialExaminationForm.get('billing')!" formGroupName="billing" completed="false">
                <ng-template matStepLabel>Billing</ng-template>
            </mat-step>
        </mat-stepper>
    </form>
</c-container>
