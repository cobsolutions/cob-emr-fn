<form [formGroup]="strengthForm" class="rom-form">
    <!-- No Limitations Noted -->
    <div class="form-row">
        <label class="field-label">No Limitations Noted</label>
        <div class="radio-group">
            <c-form-check class="me-3">
                <input cFormCheckInput type="radio" formControlName="no_limitations_noted" value="yes" />
                <label cFormCheckLabel>Yes</label>
            </c-form-check>
            <c-form-check>
                <input cFormCheckInput type="radio" formControlName="no_limitations_noted" value="no" />
                <label cFormCheckLabel>No</label>
            </c-form-check>
        </div>
    </div>
    <div *ngIf="showNoLimitationsNotedFields" class="dependent-field-box">
        <!-- Upper Extremity Checkbox -->
        <div class="form-row">
            <c-form-check>
                <input cFormCheckInput type="checkbox" formControlName="uper_extremity" />
                <label cFormCheckLabel>Upper Extremity</label>
            </c-form-check>
        </div>

        <!-- Lower Extremity Checkbox -->
        <div class="form-row">
            <c-form-check>
                <input cFormCheckInput type="checkbox" formControlName="lower_extremity" />
                <label cFormCheckLabel>Lower Extremity</label>
            </c-form-check>
        </div>
    </div>
    <!-- Selective Tissue Tension Upper -->
    <div class="form-row">
        <label class="field-label">Selective Tissue Tension Upper</label>
        <div class="radio-group">
            <c-form-check class="me-3">
                <input cFormCheckInput type="radio" formControlName="selective_tissue_tension_upper" value="yes" />
                <label cFormCheckLabel>Yes</label>
            </c-form-check>
            <c-form-check>
                <input cFormCheckInput type="radio" formControlName="selective_tissue_tension_upper" value="no" />
                <label cFormCheckLabel>No</label>
            </c-form-check>
        </div>
    </div>
    <div *ngIf="showSelectiveTissueTensionUpperFields" class="dependent-field-box">
        <div class="form-row">
            <label class="field-label">Cervical</label>
            <div class="radio-group">
                <c-form-check class="me-3">
                    <input cFormCheckInput type="radio" formControlName="cervical" value="yes" />
                    <label cFormCheckLabel>Yes</label>
                </c-form-check>
                <c-form-check>
                    <input cFormCheckInput type="radio" formControlName="cervical" value="no" />
                    <label cFormCheckLabel>No</label>
                </c-form-check>
            </div>
        </div>
        <div class="form-row">
            <label class="field-label">Trunk</label>
            <div class="radio-group">
                <c-form-check class="me-3">
                    <input cFormCheckInput type="radio" formControlName="trunk" value="yes" />
                    <label cFormCheckLabel>Yes</label>
                </c-form-check>
                <c-form-check>
                    <input cFormCheckInput type="radio" formControlName="trunk" value="no" />
                    <label cFormCheckLabel>No</label>
                </c-form-check>
            </div>
        </div>
        <div class="form-row">
            <label class="field-label">Back Ribs</label>
            <div class="radio-group">
                <c-form-check class="me-3">
                    <input cFormCheckInput type="radio" formControlName="back_ribs" value="yes" />
                    <label cFormCheckLabel>Yes</label>
                </c-form-check>
                <c-form-check>
                    <input cFormCheckInput type="radio" formControlName="back_ribs" value="no" />
                    <label cFormCheckLabel>No</label>
                </c-form-check>
            </div>
        </div>
        <div class="form-row">
            <label class="field-label">Shoulder</label>
            <div class="radio-group">
                <c-form-check class="me-3">
                    <input cFormCheckInput type="radio" formControlName="shoulder" value="yes" />
                    <label cFormCheckLabel>Yes</label>
                </c-form-check>
                <c-form-check>
                    <input cFormCheckInput type="radio" formControlName="shoulder" value="no" />
                    <label cFormCheckLabel>No</label>
                </c-form-check>
            </div>
        </div>
        <div class="form-row">
            <label class="field-label">Elbow</label>
            <div class="radio-group">
                <c-form-check class="me-3">
                    <input cFormCheckInput type="radio" formControlName="elbow" value="yes" />
                    <label cFormCheckLabel>Yes</label>
                </c-form-check>
                <c-form-check>
                    <input cFormCheckInput type="radio" formControlName="elbow" value="no" />
                    <label cFormCheckLabel>No</label>
                </c-form-check>
            </div>
        </div>
        <div class="form-row">
            <label class="field-label">Wrist</label>
            <div class="radio-group">
                <c-form-check class="me-3">
                    <input cFormCheckInput type="radio" formControlName="wrist" value="yes" />
                    <label cFormCheckLabel>Yes</label>
                </c-form-check>
                <c-form-check>
                    <input cFormCheckInput type="radio" formControlName="wrist" value="no" />
                    <label cFormCheckLabel>No</label>
                </c-form-check>
            </div>
        </div>
        <div class="form-row">
            <label class="field-label">Hand</label>
            <div class="radio-group">
                <c-form-check class="me-3">
                    <input cFormCheckInput type="radio" formControlName="hand" value="yes" />
                    <label cFormCheckLabel>Yes</label>
                </c-form-check>
                <c-form-check>
                    <input cFormCheckInput type="radio" formControlName="hand" value="no" />
                    <label cFormCheckLabel>No</label>
                </c-form-check>
            </div>
        </div>
    </div>


    <!-- Selective Tissue Tension Lower -->
    <div class="form-row">
        <label class="field-label">Selective Tissue Tension Lower</label>
        <div class="radio-group">
            <c-form-check class="me-3">
                <input cFormCheckInput type="radio" formControlName="selective_tissue_tension_lower" value="yes" />
                <label cFormCheckLabel>Yes</label>
            </c-form-check>
            <c-form-check>
                <input cFormCheckInput type="radio" formControlName="selective_tissue_tension_lower" value="no" />
                <label cFormCheckLabel>No</label>
            </c-form-check>
        </div>
    </div>
    <div *ngIf="showSelectiveTissueTensionLowerFields" class="dependent-field-box">
        <div class="form-row">
            <label class="field-label">Hip</label>
            <div class="radio-group">
                <c-form-check class="me-3">
                    <input cFormCheckInput type="radio" formControlName="hip" value="yes" />
                    <label cFormCheckLabel>Yes</label>
                </c-form-check>
                <c-form-check>
                    <input cFormCheckInput type="radio" formControlName="blood_pressure" value="no" />
                    <label cFormCheckLabel>No</label>
                </c-form-check>
            </div>
        </div>
        <div class="form-row">
            <label class="field-label">Knee</label>
            <div class="radio-group">
                <c-form-check class="me-3">
                    <input cFormCheckInput type="radio" formControlName="knee" value="yes" />
                    <label cFormCheckLabel>Yes</label>
                </c-form-check>
                <c-form-check>
                    <input cFormCheckInput type="radio" formControlName="knee" value="no" />
                    <label cFormCheckLabel>No</label>
                </c-form-check>
            </div>
        </div>
        <div class="form-row">
            <label class="field-label">Ankle</label>
            <div class="radio-group">
                <c-form-check class="me-3">
                    <input cFormCheckInput type="radio" formControlName="ankle" value="yes" />
                    <label cFormCheckLabel>Yes</label>
                </c-form-check>
                <c-form-check>
                    <input cFormCheckInput type="radio" formControlName="ankle" value="no" />
                    <label cFormCheckLabel>No</label>
                </c-form-check>
            </div>
        </div>
        <div class="form-row">
            <label class="field-label">Foot</label>
            <div class="radio-group">
                <c-form-check class="me-3">
                    <input cFormCheckInput type="radio" formControlName="foot" value="yes" />
                    <label cFormCheckLabel>Yes</label>
                </c-form-check>
                <c-form-check>
                    <input cFormCheckInput type="radio" formControlName="foot" value="no" />
                    <label cFormCheckLabel>No</label>
                </c-form-check>
            </div>
        </div>
    </div>
    <div class="form-row">
        <label class="field-label">Grip / Pinch</label>
        <div class="radio-group">
            <c-form-check class="me-3">
                <input cFormCheckInput type="radio" formControlName="grip_pinch" value="yes" />
                <label cFormCheckLabel>Yes</label>
            </c-form-check>
            <c-form-check>
                <input cFormCheckInput type="radio" formControlName="grip_pinch" value="no" />
                <label cFormCheckLabel>No</label>
            </c-form-check>
        </div>
    </div>
    <div *ngIf="showGripPinchFields" class="dependent-field-box">
    </div>
    <!-- Gross Muscle Tests Upper -->
    <div class="form-row">
        <label class="field-label">Gross Muscle Tests Upper</label>
        <div class="radio-group">
            <c-form-check class="me-3">
                <input cFormCheckInput type="radio" formControlName="gross_muscle_tests_upper" value="yes" />
                <label cFormCheckLabel>Yes</label>
            </c-form-check>
            <c-form-check>
                <input cFormCheckInput type="radio" formControlName="gross_muscle_tests_upper" value="no" />
                <label cFormCheckLabel>No</label>
            </c-form-check>
        </div>
    </div>
    <div *ngIf="showGrossMuscleTestsUpperFields" class="dependent-field-box">
        <div class="form-row">
            <label class="field-label">Cervical</label>
            <div class="radio-group">
                <c-form-check class="me-3">
                    <input cFormCheckInput type="radio" formControlName="cervical_gross_muscle_tests_upper"
                        value="yes" />
                    <label cFormCheckLabel>Yes</label>
                </c-form-check>
                <c-form-check>
                    <input cFormCheckInput type="radio" formControlName="cervical_gross_muscle_tests_upper"
                        value="no" />
                    <label cFormCheckLabel>No</label>
                </c-form-check>
            </div>
        </div>

        <div class="form-row">
            <label class="field-label">Shoulder</label>
            <div class="radio-group">
                <c-form-check class="me-3">
                    <input cFormCheckInput type="radio" formControlName="shoulder_gross_muscle_tests_upper"
                        value="yes" />
                    <label cFormCheckLabel>Yes</label>
                </c-form-check>
                <c-form-check>
                    <input cFormCheckInput type="radio" formControlName="shoulder_gross_muscle_tests_upper"
                        value="no" />
                    <label cFormCheckLabel>No</label>
                </c-form-check>
            </div>
        </div>

        <div class="form-row">
            <label class="field-label">Elbow</label>
            <div class="radio-group">
                <c-form-check class="me-3">
                    <input cFormCheckInput type="radio" formControlName="elbow_gross_muscle_tests_upper" value="yes" />
                    <label cFormCheckLabel>Yes</label>
                </c-form-check>
                <c-form-check>
                    <input cFormCheckInput type="radio" formControlName="elbow_gross_muscle_tests_upper" value="no" />
                    <label cFormCheckLabel>No</label>
                </c-form-check>
            </div>
        </div>
        <div class="form-row">
            <label class="field-label">Wrist</label>
            <div class="radio-group">
                <c-form-check class="me-3">
                    <input cFormCheckInput type="radio" formControlName="wrist_gross_muscle_tests_upper" value="yes" />
                    <label cFormCheckLabel>Yes</label>
                </c-form-check>
                <c-form-check>
                    <input cFormCheckInput type="radio" formControlName="wrist_gross_muscle_tests_upper" value="no" />
                    <label cFormCheckLabel>No</label>
                </c-form-check>
            </div>
        </div>
    </div>
    <!-- Redcord Neurac Stability Tests -->
    <div class="form-row">
        <label class="field-label">Redcord Neurac Stability Tests</label>
        <div class="radio-group">
            <c-form-check class="me-3">
                <input cFormCheckInput type="radio" formControlName="redcord_neurac_stability_tests" value="yes" />
                <label cFormCheckLabel>Yes</label>
            </c-form-check>
            <c-form-check>
                <input cFormCheckInput type="radio" formControlName="redcord_neurac_stability_tests" value="no" />
                <label cFormCheckLabel>No</label>
            </c-form-check>
        </div>
    </div>
    <div *ngIf="showRedcordNeuracStabilityTestsFields" class="dependent-field-box">
        <div class="form-row">
            <label class="field-label">Upper Body Myofascial Tests</label>
            <div class="radio-group">
                <c-form-check class="me-3">
                    <input cFormCheckInput type="radio" formControlName="upper_body_myofascial_tests" value="yes" />
                    <label cFormCheckLabel>Yes</label>
                </c-form-check>
                <c-form-check>
                    <input cFormCheckInput type="radio" formControlName="upper_body_myofascial_tests" value="no" />
                    <label cFormCheckLabel>No</label>
                </c-form-check>
            </div>
        </div>
        <div class="form-row">
            <label class="field-label">Lower Body Myofascial Tests</label>
            <div class="radio-group">
                <c-form-check class="me-3">
                    <input cFormCheckInput type="radio" formControlName="lower_body_myofascial_tests" value="yes" />
                    <label cFormCheckLabel>Yes</label>
                </c-form-check>
                <c-form-check>
                    <input cFormCheckInput type="radio" formControlName="lower_body_myofascial_tests" value="no" />
                    <label cFormCheckLabel>No</label>
                </c-form-check>
            </div>
        </div>
        <div class="form-row">
            <label class="field-label">Cervical Movements</label>
            <div class="radio-group">
                <c-form-check class="me-3">
                    <input cFormCheckInput type="radio" formControlName="cervical_movements" value="yes" />
                    <label cFormCheckLabel>Yes</label>
                </c-form-check>
                <c-form-check>
                    <input cFormCheckInput type="radio" formControlName="cervical_movements" value="no" />
                    <label cFormCheckLabel>No</label>
                </c-form-check>
            </div>
        </div>
        <div class="form-row">
            <label class="field-label">Cervical Motor Control Tests</label>
            <div class="radio-group">
                <c-form-check class="me-3">
                    <input cFormCheckInput type="radio" formControlName="cervical_motor_control_tests" value="yes" />
                    <label cFormCheckLabel>Yes</label>
                </c-form-check>
                <c-form-check>
                    <input cFormCheckInput type="radio" formControlName="cervical_motor_control_tests" value="no" />
                    <label cFormCheckLabel>No</label>
                </c-form-check>
            </div>
        </div>
        <div class="form-row">
            <label class="field-label">Lumbar Motor Control Tests</label>
            <div class="radio-group">
                <c-form-check class="me-3">
                    <input cFormCheckInput type="radio" formControlName="lumbar_motor_control_tests" value="yes" />
                    <label cFormCheckLabel>Yes</label>
                </c-form-check>
                <c-form-check>
                    <input cFormCheckInput type="radio" formControlName="lumbar_motor_control_tests" value="no" />
                    <label cFormCheckLabel>No</label>
                </c-form-check>
            </div>
        </div>
    </div>
    <div class="form-row">
        <label class="field-label">Gross Muscle Tests Trunk</label>
        <div class="radio-group">
            <c-form-check class="me-3">
                <input cFormCheckInput type="radio" formControlName="gross_muscle_tests_trunk" value="yes" />
                <label cFormCheckLabel>Yes</label>
            </c-form-check>
            <c-form-check>
                <input cFormCheckInput type="radio" formControlName="gross_muscle_tests_trunk" value="no" />
                <label cFormCheckLabel>No</label>
            </c-form-check>
        </div>
    </div>
    <div *ngIf="showGrossMuscleTestsTrunkFields" class="dependent-field-box">
    </div>
    <div class="form-row">
        <label class="field-label">Gross Muscle Tests Lower</label>
        <div class="radio-group">
            <c-form-check class="me-3">
                <input cFormCheckInput type="radio" formControlName="gross_muscle_tests_lower" value="yes" />
                <label cFormCheckLabel>Yes</label>
            </c-form-check>
            <c-form-check>
                <input cFormCheckInput type="radio" formControlName="gross_muscle_tests_lower" value="no" />
                <label cFormCheckLabel>No</label>
            </c-form-check>
        </div>
    </div>
    <div *ngIf="showGrossMuscleTestsLowerFields" class="dependent-field-box">
    </div>
    <div class="form-row">
        <label class="field-label">Core Strength</label>
        <div class="radio-group">
            <c-form-check class="me-3">
                <input cFormCheckInput type="radio" formControlName="core_strength" value="yes" />
                <label cFormCheckLabel>Yes</label>
            </c-form-check>
            <c-form-check>
                <input cFormCheckInput type="radio" formControlName="core_strength" value="no" />
                <label cFormCheckLabel>No</label>
            </c-form-check>
        </div>
    </div>
    <div *ngIf="showCoreStrengthFields" class="dependent-field-box">
    </div>
    <div class="form-row">
        <label class="field-label">Manual Muscle Tests</label>
        <div class="radio-group">
            <c-form-check class="me-3">
                <input cFormCheckInput type="radio" formControlName="manual_muscle_tests" value="yes" />
                <label cFormCheckLabel>Yes</label>
            </c-form-check>
            <c-form-check>
                <input cFormCheckInput type="radio" formControlName="manual_muscle_tests" value="no" />
                <label cFormCheckLabel>No</label>
            </c-form-check>
        </div>
    </div>
    <div *ngIf="showManualMuscleTestsFields" class="dependent-field-box">
    </div>
    <div class="form-row">
        <label class="field-label">Additional Comments</label>
        <div class="radio-group">
            <c-form-check class="me-3">
                <input cFormCheckInput type="radio" formControlName="additional_comments" value="yes" />
                <label cFormCheckLabel>Yes</label>
            </c-form-check>
            <c-form-check>
                <input cFormCheckInput type="radio" formControlName="additional_comments" value="no" />
                <label cFormCheckLabel>No</label>
            </c-form-check>
        </div>
    </div>

    <div *ngIf="showAdditionalCommentsFields" class="dependent-field-box">
    </div>
</form>
