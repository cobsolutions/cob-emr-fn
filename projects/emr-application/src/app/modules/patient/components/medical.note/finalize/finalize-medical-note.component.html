<span *ngIf="!finalizeMessageFlag">
    <h4>Are you sure you want to finalize medical note</h4>
    <div class="dialog-actions">
        <button class="btn btn-yes" (click)="onYes()">Yes</button>
        <button class="btn btn-no" (click)="onNo()">No</button>
    </div>
</span>
<span *ngIf="finalizeMessageFlag">
    <h4>{{finalizeMessage}}
        <c-spinner color="secondary" variant="grow"></c-spinner>
    </h4>
</span>
