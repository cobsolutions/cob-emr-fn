<div [formGroup]="formGroup">
    <div class="checkbox-group-vertical">
        <div *ngFor="let option of options">
            <c-form-check>
                <input cFormCheckInput type="checkbox" [formControlName]="option.formControlName" />
                <label cFormCheckLabel>{{ option.label }}</label>
            </c-form-check>

            <!-- Show children and textarea if option has children -->
            <div *ngIf="option.showChildren && option.children && option.children.length > 0" class="child-checkbox-group">
                <c-form-check *ngFor="let child of option.children" class="child-checkbox">
                    <input cFormCheckInput type="checkbox" [formControlName]="child.formControlName" />
                    <label cFormCheckLabel>{{ child.label }}</label>
                </c-form-check>

                <textarea
                    class="child-textarea"
                    [formControlName]="option.formControlName + '_notes'"
                    rows="4"
                    placeholder="Additional notes..."></textarea>
            </div>

            <!-- Show only textarea if option has no children -->
            <div *ngIf="option.showChildren && (!option.children || option.children.length === 0)" class="child-textarea-only">
                <textarea
                    class="child-textarea"
                    [formControlName]="option.formControlName + '_notes'"
                    rows="4"
                    placeholder="Additional notes..."></textarea>
            </div>
        </div>
    </div>
</div>
