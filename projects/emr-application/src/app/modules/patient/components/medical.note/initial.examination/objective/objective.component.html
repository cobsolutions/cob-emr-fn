<div class="d-flex justify-content-center">
    <c-card class="mb-2 card-center">
        <c-card-header>
            <strong>Examination Profile</strong>
        </c-card-header>
        <c-card-body>
            <select id="profile-select" cSelect (change)="selectProfile()" [(ngModel)]="selectedProfile">
                <option disabled selected value="null">Select Examination Profile</option>
                <option *ngFor="let profile of profiles | async" [value]="profile.name">
                    {{ profile.name }}
                </option>
            </select>
        </c-card-body>
    </c-card>
</div>
<div [formGroup]="objectiveForm">
    <!--Inspection-->
    <c-card class="mb-2">
        <c-card-header>Inspection</c-card-header>
        <c-card-body>
        </c-card-body>
    </c-card>
    <!--Outcome Measurement Tools-->
    <c-card class="mb-2">
        <c-card-header>Outcome Measurement Tools</c-card-header>
        <c-card-body>
        </c-card-body>
    </c-card>
    <!--Observation-->
    <c-card class="mb-2">
        <c-card-header>Observation</c-card-header>
        <c-card-body>
            <observation (formReady)="setChildForm('observation', $event)"></observation>
        </c-card-body>
    </c-card>
    <!--Range of Motion-->
    <c-card class="mb-2">
        <c-card-header>Range of Motion</c-card-header>
        <c-card-body>
        </c-card-body>
    </c-card>
    <!--Strength-->
    <c-card class="mb-2">
        <c-card-header>Strength</c-card-header>
        <c-card-body>

        </c-card-body>
    </c-card>

    <!--Neuro-Vascular-->
    <c-card class="mb-2">
        <c-card-header>Neuro-Vascular</c-card-header>
        <c-card-body>

        </c-card-body>
    </c-card>

    <!--Special Tests-->
    <c-card class="mb-2">
        <c-card-header>Special Tests</c-card-header>
        <c-card-body>

        </c-card-body>
    </c-card>

    <!--Palpation-->
    <c-card class="mb-2">
        <c-card-header>Palpation</c-card-header>
        <c-card-body>

        </c-card-body>
    </c-card>
    <div class="mt-3">
        <button cButton matStepperPrevious size="sm" variant="outline" class="mx-2">Back</button>
        <button cButton variant="outline" size="sm" (click)="next()">Next</button>
    </div>
</div>
