<div [formGroup]="subjectiveForm">
    <c-card class="mb-2">
        <c-card-header>Basic Information</c-card-header>
        <c-card-body>
            <basic-information (formReady)="setChildForm('basic', $event)"></basic-information>
        </c-card-body>
    </c-card>
    <c-card class="mb-2">
        <c-card-header>Prior Level Of Function</c-card-header>
        <c-card-body>
            <prior-level-function (formReady)="setChildForm('priorFunction', $event)"></prior-level-function>
        </c-card-body>
    </c-card>
    <c-card class="mb-2">
        <c-card-header>Current Functional Limitations</c-card-header>
        <c-card-body>
            <current-functionlimit (formReady)="setChildForm('currentFunction', $event)"></current-functionlimit>
        </c-card-body>
    </c-card>
    <c-card class="mb-2">
        <c-card-header>Pain</c-card-header>
        <c-card-body>
            <pain (formReady)="setChildForm('pain', $event)"></pain>
        </c-card-body>
    </c-card>
    <c-card class="mb-2">
        <c-card-header>Medical History</c-card-header>
        <c-card-body>
            <medical-history (formReady)="setChildForm('pain', $event)"></medical-history>
        </c-card-body>
    </c-card>


    <div class="mt-3">
        <button cButton variant="outline" size="sm" (click)="next()">Next</button>
    </div>
</div>
