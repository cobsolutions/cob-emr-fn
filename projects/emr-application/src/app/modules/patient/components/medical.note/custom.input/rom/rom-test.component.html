<div [formGroup]="form">
    <!-- Apply to All -->
    <div class="apply-all-row rom-container">
      <div class="test-label apply-label">Apply to All</div>
      <select class="dropdown" (change)="applyToAll($event)">
        <option value=""></option>
        <option value="WNL">WNL</option>
        <option value="WFL">WFL</option>
        <option value="NT">Not Tested</option>
      </select>
      <div></div>
    </div>
  
    <!-- Two-column layout -->
    <ng-container *ngIf="columns === 2">
      <div class="rom-container side-label">
        <div></div>
        <div>{{ rightLabel }}</div>
        <div>{{ leftLabel }}</div>
      </div>
  
      <div *ngFor="let control of controlR; let i = index" class="rom-container">
        <div class="test-label">{{ control.label }}</div>
  
        <!-- Right side -->
        <div class="dropdown-with-custom">
          <select
            class="dropdown"
            [formControlName]="'right_' + toCamelCase(control.label) + '_' + parentFieldName">
            <option *ngFor="let opt of control.value" [value]="opt.val">{{ opt.view }}</option>
          </select>
  
          <!-- Show custom input -->
          <input
            *ngIf="form.get('right_' + toCamelCase(control.label) + '_' + parentFieldName + '_custom')"
            type="text"
            class="custom-input"
            [formControlName]="'right_' + toCamelCase(control.label) + '_' + parentFieldName + '_custom'"/>
        </div>
  
        <!-- Left side -->
        <div class="dropdown-with-custom">
          <select
            class="dropdown"
            [formControlName]="'left_' + toCamelCase(controlL[i]?.label || control.label) + '_' + parentFieldName">
            <option *ngFor="let opt of controlL[i]?.value || control.value" [value]="opt.val">{{ opt.view }}</option>
          </select>
  
          <input
            *ngIf="form.get('left_' + toCamelCase(controlL[i]?.label || control.label) + '_' + parentFieldName + '_custom')"
            type="text"
            class="custom-input"
            [formControlName]="'left_' + toCamelCase(controlL[i]?.label || control.label) + '_' + parentFieldName + '_custom'"/>
        </div>
      </div>
    </ng-container>
  
    <!-- One-column layout -->
    <ng-container *ngIf="columns === 1">
      <div *ngFor="let control of controlR" class="single-column-container">
        <div class="single-label">{{ control.label }}</div>
        <div class="dropdown-with-custom">
          <select
            class="dropdown"
            [formControlName]="'right_' + toCamelCase(control.label) + '_' + parentFieldName">
            <option *ngFor="let opt of control.value" [value]="opt.val">{{ opt.view }}</option>
          </select>
  
          <input
            *ngIf="form.get('right_' + toCamelCase(control.label) + '_' + parentFieldName + '_custom')"
            type="text"
            class="custom-input"
            [formControlName]="'right_' + toCamelCase(control.label) + '_' + parentFieldName + '_custom'"/>
        </div>
      </div>
    </ng-container>
  </div>
