<form [formGroup]="form">
    <div class="procedure-item">
        <input  type="number" cFormControl [formControlName]="value" class="procedure-input" min="0" sizing="sm" 
        [matTooltip]="'Billing Code: ' + value"
        matTooltipPosition="above"/>
        <label class="procedure-label" class="mx-2">{{ label }}</label>
    </div>
</form>
