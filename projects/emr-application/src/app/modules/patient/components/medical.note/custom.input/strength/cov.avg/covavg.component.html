<form [formGroup]="form">
    <div class="container">
      <!-- Right Side -->
      <div class="side-group">
        <label>Right</label>
        <div class="input-row">
          <input formControlName="rightValue1" />
          <input formControlName="rightValue2" />
          <input formControlName="rightValue3" />
        </div>
        <div class="single-input">
          <label>COV</label>
          <input formControlName="rightCov" />
        </div>
        <div class="single-input">
          <label>AVG</label>
          <input formControlName="rightAvg" />
        </div>
        <div class="single-input">
          <label>Comments</label>
          <textarea formControlName="rightComments"></textarea>
        </div>
      </div>
  
      <!-- Left Side -->
      <div class="side-group">
        <label>Left</label>
        <div class="input-row">
          <input formControlName="leftValue1" />
          <input formControlName="leftValue2" />
          <input formControlName="leftValue3" />
        </div>
        <div class="single-input">
          <label>COV</label>
          <input formControlName="leftCov" />
        </div>
        <div class="single-input">
          <label>AVG</label>
          <input formControlName="leftAvg" />
        </div>
        <div class="single-input">
          <label>Comments</label>
          <textarea formControlName="leftComments"></textarea>
        </div>
      </div>
    </div>
  </form>
