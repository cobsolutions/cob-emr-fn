<form [formGroup]="assessmentForm">
    <!-- Assessment/Diagnosis -->
    <div class="form-row">
        <label class="field-label">Assessment/Diagnosis</label>
        <textarea formControlName="assessment_diagnosis" class="form-textarea" rows="10"></textarea>
    </div>
    <!-- Patient Clinical Presentation  -->
    <div class="form-row">
        <label class="field-label">Patient Clinical Presentation</label>
        <div class="radio-group-vertical">
            <c-form-check>
                <input cFormCheckInput type="radio" formControlName="patient_clinical_presentation" value="Low" />
                <label cFormCheckLabel><strong>Low Complexity</strong> - The clinical presentation is stable and/or
                    uncomplicated.</label>
            </c-form-check>
            <c-form-check>
                <input cFormCheckInput type="radio" formControlName="patient_clinical_presentation" value="Moderate" />
                <label cFormCheckLabel><strong>Moderate Complexity</strong> - The clinical presentation is evolving with
                    changing characteristics.</label>
            </c-form-check>
            <c-form-check>
                <input cFormCheckInput type="radio" formControlName="patient_clinical_presentation" value="High" />
                <label cFormCheckLabel><strong>High Complexity</strong> - he clinical presentation is unstable with
                    unpredictable characteristics.</label>
            </c-form-check>
        </div>
    </div>
    <!-- Parent/Patient Education: -->
    <div class="form-row">
        <label class="field-label">Parent/Patient Education</label>
        <textarea formControlName="parent_patient_education" class="form-textarea" rows="10"></textarea>
    </div>
    <div class="form-row">
        <label class="field-label"></label>
        <div class="checkbox-group-vertical">
            <c-form-check>
                <input cFormCheckInput type="checkbox" formControlName="patient_compliance_hep" />
                <label cFormCheckLabel>Patient Demonstrates Compliance with Prescribed HEP</label>
            </c-form-check>
            <div *ngIf="showPatientComplianceHEP" class="dependent-field-box">
                <c-form-check>
                    <input cFormCheckInput type="checkbox" formControlName="patient_consultation_maintain_or_resume" />
                    <label cFormCheckLabel>Patient consulted during this visit to maintain or resume normal
                        activities.</label>
                </c-form-check>
                <div *ngIf="showPatientConsultationMaintain" class="dependent-field-box">
                    <div class="form-row">
                        <input class="form-input " formControlName="patient_consultation_maintain_or_resume_txt" />
                    </div>
                </div>
                <c-form-check>
                    <input cFormCheckInput type="checkbox" formControlName="patient_consultation_against_bed_rest" />
                    <label cFormCheckLabel>Patient consulted during this visit against bed rest lasting 4 days or
                        longer.</label>
                </c-form-check>
                <div *ngIf="showPatientConsultationbedRest" class="dependent-field-box">
                    <div class="form-row">
                        <input class="form-input" formControlName="patient_consultation_against_bed_rest_txt" />
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Rehab Potential -->
    <div class="form-row">
        <label class="field-label">Rehab Potential</label>
        <select class="form-select-custom small-input" formControlName="rehab_potential">
            <option value="">Select</option>
            <option value="excellent">Excellent</option>
            <option value="good">Good</option>
            <option value="fair">Fair</option>
        </select>
    </div>
    <!-- Contraindications to Therapy -->
    <div class="form-row">
        <label class="field-label">Contraindications to Therapy</label>
        <div class="radio-group-primary">
            <c-form-check>
                <input cFormCheckInput type="radio" formControlName="contraindications_to_therapy" value="yes" />
                <label cFormCheckLabel>Yes</label>
            </c-form-check>
            <c-form-check>
                <input cFormCheckInput type="radio" formControlName="contraindications_to_therapy" value="no" />
                <label cFormCheckLabel>No</label>
            </c-form-check>
        </div>
    </div>
    <div *ngIf="showContraindicationsToTherapy" class="dependent-field-box">
        <c-form-check>
            <input cFormCheckInput type="checkbox" formControlName="contraindications_to_therapy_consent" />
            <label cFormCheckLabel>Following the evaluation and extensive patient education regarding diagnosis, prognosis, and treatment goals, the patient (parent/guardian, power of attorney holder) actively participated in the creation of the current goals and agrees to the current treatment plan.</label>
        </c-form-check>
    </div>
    <!-- Consent to care -->
    <div class="form-row">
        <label class="field-label">Consent to care</label>
        <textarea formControlName="consent_to_care" class="form-textarea" rows="7"></textarea>
    </div>

    <!-- Problem List -->
    <c-card class="mb-2">
        <c-card-header>Problem List</c-card-header>
        <c-card-body>
            <assessment-problem (problemAdded)="onProblemAdded($event)" (problemEdited)="onProblemEdited($event)"
                (problemRemoved)="onProblemRemoved($event)" [problems]="problems"></assessment-problem>
        </c-card-body>
    </c-card>

    <!-- Goal List -->
    <c-card>
        <c-card-header>Goal List</c-card-header>
        <c-card-body>
            <assessment-goals [goalsFormArray]="goals" (goalAdded)="onGoalAdded($event)"
                (goalEdited)="onGoalEdited($event)" (goalRemoved)="onGoalRemoved($event)"></assessment-goals>
        </c-card-body>
    </c-card>


    <div class="action-buttons">
        <button cButton matStepperPrevious class="action-button back-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span>Back</span>
        </button>
        <button cButton class="action-button next-button" (click)="next()">
            <span>Next</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
    </div>
</form>
