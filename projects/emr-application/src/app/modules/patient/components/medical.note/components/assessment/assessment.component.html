<form [formGroup]="assessmentForm" *ngIf="fields">
    <div class="fields-container">
        <div class="field-item" *ngFor="let field of fields;">
            <soap-field-builder [field]="field" [form]="assessmentForm" [filedStyle]="getstyleFieldControl(field.name)"
                [styles]="styles">
            </soap-field-builder>
        </div>
    </div>
    <!-- Problem List -->
    <c-card class="mb-2">
        <c-card-header>Problem List</c-card-header>
        <c-card-body>
            <div class="form-group">
                <div class="goal-form-container">
                    <div class="goal-input">
                        <label>Problem Description</label>
                        <input #problemInput aria-describedby="button-addon2" aria-label="Recipient's username"
                            cFormControl placeholder="Enter problem description" />
                    </div>
                    <div class="add-btn-container">
                        <button type="button" (click)="addProblem(problemInput)" class="add-goal-btn">
                            ➕ Add Problem
                        </button>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <table class="table table-sm p-1 mb-3">
                <thead>
                    <tr>
                        <th>Problems Description</th>
                        <th style="width: 50px;"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let problem of problems?.controls; let i = index">
                        <td>{{ problem.value }}</td>
                        <td class="text-center">
                            <button cButton color="danger" variant="outline" size="sm" (click)="removeProblem(i)">
                                <svg cIcon name="cilTrash"></svg>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </c-card-body>
    </c-card>

    <!-- Goal List -->
    <c-card>
        <c-card-header>
            <label>Goal List:</label>
        </c-card-header>
        <c-card-body>
            <div class="form-group">
                <div class="goal-form-container">
                    <!-- Goal Term & Period in one line -->
                    <div class="goal-row">
                        <div class="goal-input">
                            <label>Goal Term</label>
                            <select cSelect #goalTerm>
                                <option value="Short Term">Short Term</option>
                                <option value="Long Term">Long Term</option>
                            </select>
                        </div>
                        <div class="goal-input">
                            <label>Goal Period</label>
                            <select cSelect #goalPeriod>
                                <option value="1-visit">1 Visit</option>
                                <option value="1-week">1 Week</option>
                                <option value="2-weeks">2 Weeks</option>
                                <option value="3-weeks">3 Weeks</option>
                                <option value="4-weeks">4 Weeks</option>
                                <option value="5-weeks">5 Weeks</option>
                            </select>
                        </div>
                    </div>

                    <!-- Goal Met on a separate line -->
                    <div class="goal-input">
                        <label>Goal Met</label>
                        <select cSelect #goalMet>
                            <option value="N/A">N/A</option>
                            <option value="50%">50%</option>
                            <option value="75%">75%</option>
                            <option value="90%">90%</option>
                            <option value="100%">100%</option>
                        </select>
                    </div>

                    <!-- Goal Description (Full Width) -->
                    <div class="goal-input">
                        <label>Goal Description</label>
                        <textarea #goalDescription placeholder="Enter goal description"></textarea>
                    </div>

                    <div class="add-btn-container">
                        <button type="button" (click)="addGoal(goalDescription, goalTerm, goalPeriod, goalMet)"
                            class="add-goal-btn">
                            ➕ Add Goal
                        </button>
                    </div>
                </div>

            </div>

            <!-- Goals Table -->
            <table class="table table-sm p-1">
                <thead>
                    <tr>
                        <th>Description</th>
                        <th>Term</th>
                        <th>Period</th>
                        <th>Goal Met</th>
                        <th style="width: 50px;"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let goal of goals?.controls; let i = index" [formGroup]="getGoalFormGroup(i)">
                        <td>{{ goal.value.description }}</td>
                        <td>{{ goal.value.term }}</td>
                        <td>{{ goal.value.period }}</td>
                        <td>{{ goal.value.met }}</td>
                        <td class="text-center">
                            <button (click)="removeGoal(i)" cButton color="danger" variant="outline" size="sm">
                                <svg cIcon name="cilTrash"></svg></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </c-card-body>
    </c-card>


    <div class="mt-3">
        <button cButton matStepperPrevious size="sm" variant="outline" class="mx-2">Back</button>
        <button cButton variant="outline" size="sm" (click)="next()">Next</button>
    </div>
</form>
