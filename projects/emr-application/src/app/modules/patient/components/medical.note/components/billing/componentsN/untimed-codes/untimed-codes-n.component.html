<div class="untimed-codes-container" [formGroup]="UntimedCodes">
  <div class="checkbox-list">
    <div *ngFor="let code of billingCPTCodeList" class="checkbox-item">
      <c-form-check>
        <input
          cFormCheckInput
          type="checkbox"
          [id]="'cpt-' + code.cpt"
          [formControlName]="code.cpt + '_checked'"
          (change)="onCheckboxChange(code.cpt, $event)"
        />
        <label
          cFormCheckLabel
          [for]="'cpt-' + code.cpt"
          [title]="'CPT Code: ' + code.cpt"
        >
          {{ code.description }}
        </label>
      </c-form-check>

      <div *ngIf="isChecked(code.cpt)" class="sub-items-wrapper">
        <!-- Sub-checkboxes for specific CPT codes -->
        <div *ngIf="getSubItems(code.cpt).length > 0" class="sub-checkbox-list">
          <c-form-check *ngFor="let subItem of getSubItems(code.cpt)">
            <input
              cFormCheckInput
              type="checkbox"
              [id]="'sub-' + code.cpt + '-' + subItem"
              [formControlName]="code.cpt + '_sub_' + subItem"
              (change)="onSubCheckboxChange(code.cpt, subItem, $event)"
            />
            <label
              cFormCheckLabel
              [for]="'sub-' + code.cpt + '-' + subItem"
            >
              {{ subItem }}
            </label>
          </c-form-check>
        </div>

        <div class="textarea-wrapper">
          <textarea
            [id]="'notes-' + code.cpt"
            [formControlName]="code.cpt + '_notes'"
            placeholder="Enter notes for {{ code.cpt }}"
            rows="3"
            class="form-control"
          ></textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- Custom codes section -->
  <div class="custom-codes-section">
    <div class="custom-codes-header">Custom Codes</div>

    <div *ngIf="customCodeIds.length === 0" class="custom-codes-empty">
      No custom codes added yet.
    </div>

    <div *ngFor="let id of customCodeIds" class="custom-code-item">
      <div class="custom-code-row">
        <c-form-check class="custom-code-check">
          <input
            cFormCheckInput
            type="checkbox"
            [id]="'custom-' + id + '-checked'"
            [formControlName]="customControlKey(id, 'checked')"
          />
          <label
            cFormCheckLabel
            [for]="'custom-' + id + '-checked'"
          ></label>
        </c-form-check>

        <input
          cFormControl
          type="text"
          class="form-control custom-code-name"
          [formControlName]="customControlKey(id, 'name')"
          placeholder="Description"
        />

        <input
          cFormControl
          type="text"
          class="form-control custom-code-code"
          [formControlName]="customControlKey(id, 'code')"
          placeholder="Code"
        />

        <button
          type="button"
          class="custom-code-remove"
          (click)="removeCustomCode(id)"
          title="Remove custom code"
        >
          &times;
        </button>
      </div>

      <div *ngIf="isCustomChecked(id)" class="textarea-wrapper custom-code-notes">
        <textarea
          [formControlName]="customControlKey(id, 'notes')"
          placeholder="Enter notes"
          rows="3"
          class="form-control"
        ></textarea>
      </div>
    </div>

    <button
      type="button"
      class="custom-code-add"
      (click)="addCustomCode()"
    >
      + Add custom code
    </button>
  </div>
</div>
