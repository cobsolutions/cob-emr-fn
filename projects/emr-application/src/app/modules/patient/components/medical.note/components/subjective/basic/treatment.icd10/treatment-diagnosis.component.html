<c-card class="mb-2" [style]="style">
  <c-card-header>Treatment Diagnosis</c-card-header>
  <c-card-body>
    <div class="toolbar">
      <button cButton color="primary" variant="outline" class="icon-btn" (click)="toggleSearch()"
        [attr.title]="showSearch ? 'Hide Search' : 'Add Treatment Diagnosis'">
        <svg *ngIf="!showSearch" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
          viewBox="0 0 24 24">
          <path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6z" />
        </svg>
        <svg *ngIf="showSearch" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
          viewBox="0 0 24 24">
          <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" />
        </svg>
      </button>
    </div>

    <!-- Search Section -->
    <div *ngIf="showSearch" [@slideDown]>
      <div class="mb-3">
        <label>Enter ICD-10 code or description</label>
        <div class="input-group">
          <input type="text" class="form-control" [formControl]="diagnosisCtrl"
            placeholder="Type to search ICD-10 code" />
          <button cButton variant="outline" color="primary" (click)="onSearch()">
            {{ isLoading ? 'Searching...' : 'Search' }}
          </button>
          <button cButton variant="outline" color="secondary" (click)="clearSearch()"
            [disabled]="isLoading && !diagnosisCtrl.value">
            Clear
          </button>
        </div>
      </div>

      <!-- Dropdown Results -->
      <div class="dropdown-container" *ngIf="filteredDiagnosis.length > 0">
        <div class="dropdown-header">
          <span class="col-code">Code</span>
          <span class="col-desc">Description</span>
        </div>

        <ul class="list-group">
          <li *ngFor="let option of filteredDiagnosis" class="list-group-item"
            (mousedown)="addDiagnosis(transformToObjectArray(option))">
            <span class="col-code">{{ option[0] }}</span>
            <span class="col-desc">{{ option[1] }}</span>
          </li>
        </ul>
      </div>

      <div *ngIf="isLoading" class="text-center mb-3">
        <c-spinner color="primary"></c-spinner>
      </div>
    </div>

    <!-- Added Diagnoses Table -->
    <table class="table table-sm p-1 mb-3">
      <thead>
        <tr>
          <th style="max-width: 140px;">Code</th>
          <th>Description</th>
          <th class="text-center" style="width: 60px;">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let diag of sortedDiagnosis; let i = index">
          <td>{{ diag.code }}</td>
          <td>{{ diag.description }}</td>
          <td class="text-center">
            <div class="action-buttons">
              <button cButton variant="ghost" class="action-btn up" (click)="moveUp(i)" [disabled]="i === 0"
                title="Move Up">
                ⬆️
              </button>

              <button cButton variant="ghost" class="action-btn down" (click)="moveDown(i)"
                [disabled]="i === addedDiagnosis.length - 1" title="Move Down">
                ⬇️
              </button>

              <button cButton variant="ghost" class="action-btn remove" (click)="removeDiagnosis(i)" title="Remove">
                ❌
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </c-card-body>
</c-card>
