<div style="display: flex; flex-direction: column; align-items: center; margin-top: 20px;" *ngIf="clinicalUsers">
    <span *ngIf="!errorMessage">
        <select id="userSelect" [(ngModel)]="selectedUserUuid" cFormControl cSelect sizing="sm"
            style="padding: 6px 12px; font-size: 16px; min-width: 250px;">
            <option *ngFor="let user of clinicalUsers" [value]="user.uuid">
                {{ user.lastName +','+user.firstName }}
            </option>
        </select>
        <div class="text-center">
            <button (click)="onUserSelect()" style="margin-top: 16px; padding: 6px 16px; font-size: 16px;" cButton>
                Forward
            </button>
        </div>
    </span>
    <span *ngIf="errorMessage" style="color: red; margin-bottom: 12px;">

    </span>
    <div *ngIf="errorMessage" style="background-color: #ffe6e6; border: 1px solid #ff4d4d; color: #b30000;
           padding: 10px 20px; border-radius: 8px; margin-bottom: 16px; font-weight: 500;">
        ⚠️{{errorMessage}}
    </div>
</div>
