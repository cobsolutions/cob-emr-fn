<div *ngIf="formGroup; else noFormTemplate" [formGroup]="formGroup">
  <!-- Loading state -->
  <div *ngIf="!title || !labels" class="loading-state">
    <p>Loading assessment...</p>
  </div>

  <!-- Title Section -->
  <div *ngIf="title" class="title-section">
    <h3 class="muscle-title">{{ title }}</h3>
  </div>

  <!-- Two Column Checkboxes Table -->
  <div *ngIf="labels && labels.length > 0" class="checkbox-columns-container">
    <!-- Header Row -->
    <div class="column-headers">
      <div class="label-header"></div>
      <div class="right-header">{{ rightColumnLabel }}</div>
      <div class="left-header">{{ leftColumnLabel }}</div>
    </div>

    <!-- Checkbox Rows -->
    <div class="checkbox-rows">
      <div *ngFor="let label of labels; let i = index" class="checkbox-row">
        <!-- Label Column -->
        <div class="row-label">
          <span class="label-text">{{ label }}</span>
        </div>

        <!-- Right Column Checkbox -->
        <div class="right-column">
          <label class="checkbox-wrapper" [for]="getFieldName(label, 'right', i) + '_checkbox'">
            <input
              type="checkbox"
              class="table-checkbox"
              [formControlName]="getFieldName(label, 'right', i)"
              [id]="getFieldName(label, 'right', i) + '_checkbox'">
          </label>
        </div>

        <!-- Left Column Checkbox -->
        <div class="left-column">
          <label class="checkbox-wrapper" [for]="getFieldName(label, 'left', i) + '_checkbox'">
            <input
              type="checkbox"
              class="table-checkbox"
              [formControlName]="getFieldName(label, 'left', i)"
              [id]="getFieldName(label, 'left', i) + '_checkbox'">
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div *ngIf="labels && labels.length === 0" class="empty-state">
    <p>No assessment criteria available.</p>
  </div>

  <!-- Comments Section -->
  <div *ngIf="showComments" class="comments-section">
    <label class="comments-label" [for]="getCommentsFieldName() + '_textarea'">
      {{ commentsLabel }}
    </label>
    <textarea
      class="form-textarea"
      [formControlName]="getCommentsFieldName()"
      [id]="getCommentsFieldName() + '_textarea'"
      rows="3"
      [placeholder]="'Enter any comments for ' + (title || 'this assessment') + '...'">
    </textarea>
  </div>
</div>

<ng-template #noFormTemplate>
  <div class="error-state">
    <p>⚠️ Error: Form group is not provided for assessment.</p>
  </div>
</ng-template>
