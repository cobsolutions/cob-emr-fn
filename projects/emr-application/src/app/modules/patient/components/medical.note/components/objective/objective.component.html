<div class="d-flex justify-content-center">
    <c-card class="mb-3 card-center enhanced-card">
        <c-card-header class="enhanced-card-header profile-header">
            <div class="card-header-content">
                <div class="card-header-title">
                    <svg class="card-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                    </svg>
                    <span>Examination Profile</span>
                </div>
                <span class="card-badge">Setup</span>
            </div>
        </c-card-header>
        <c-card-body class="enhanced-card-body">
            <div [formGroup]="objectiveForm">
                <select id="profile-select" cSelect formControlName="profile" (change)="selectProfile()"
                    [disabled]="isNotInitialExaminationNote">
                    <option disabled [value]="null">Select Examination Profile</option>
                    <option *ngFor="let profile of activeProfiles " [value]="profile.name">
                        {{ profile.name }}
                    </option>
                </select>
            </div>
        </c-card-body>
    </c-card>
</div>
<div [formGroup]="objectiveForm" *ngIf="isProfileSelected">
    <!--Inspection-->
    <c-card class="mb-3 enhanced-card">
        <c-card-header class="enhanced-card-header inspection-header">
            <div class="card-header-content">
                <div class="card-header-title">
                    <svg class="card-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <span>Inspection</span>
                </div>
                <span class="card-badge">Visual</span>
            </div>
        </c-card-header>
        <c-card-body class="enhanced-card-body">
            <inspectionN [inspectionData]="inspectionData" (formReady)="setChildForm('inspection', $event)">
            </inspectionN>
        </c-card-body>
    </c-card>

    <!--Outcome Measurement Tools-->
    <c-card class="mb-3 enhanced-card">
        <c-card-header class="enhanced-card-header omt-header">
            <div class="card-header-content">
                <div class="card-header-title">
                    <svg class="card-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="12" y1="20" x2="12" y2="10"></line>
                        <line x1="18" y1="20" x2="18" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="16"></line>
                    </svg>
                    <span>Outcome Measurement Tools</span>
                </div>
                <span class="card-badge">Metrics</span>
            </div>
        </c-card-header>
        <c-card-body class="enhanced-card-body">
            <outcome-measurement-tools (formReady)="setChildForm('omt', $event)"
                [omtData]="omtData"></outcome-measurement-tools>
        </c-card-body>
    </c-card>

    <!--Observation-->
    <c-card class="mb-3 enhanced-card">
        <c-card-header class="enhanced-card-header observation-header">
            <div class="card-header-content">
                <div class="card-header-title">
                    <svg class="card-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <span>Observation</span>
                </div>
                <span class="card-badge">Clinical</span>
            </div>
        </c-card-header>
        <c-card-body class="enhanced-card-body">
            <observation-n (formReady)="setChildForm('observation', $event)"
                [observationData]="observationData"></observation-n>
        </c-card-body>
    </c-card>

    <!--Range of Motion-->
    <c-card class="mb-3 enhanced-card">
        <c-card-header class="enhanced-card-header rom-header">
            <div class="card-header-content">
                <div class="card-header-title">
                    <svg class="card-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
                    </svg>
                    <span>Range of Motion</span>
                </div>
                <span class="card-badge">ROM</span>
            </div>
        </c-card-header>
        <c-card-body class="enhanced-card-body">
            <range-of-motion-n (formReady)="setChildForm('rangeOfMotion', $event)"
                [rangeOfMotionData]="romData"></range-of-motion-n>
        </c-card-body>
    </c-card>

    <!--Strength-->
    <c-card class="mb-3 enhanced-card">
        <c-card-header class="enhanced-card-header strength-header">
            <div class="card-header-content">
                <div class="card-header-title">
                    <svg class="card-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M6.5 6.5L10 3h4l3.5 3.5"></path>
                        <path d="M6 14a2 2 0 0 1-2 2H2v-4h2a2 2 0 0 1 2 2zm14 0a2 2 0 0 0 2 2h2v-4h-2a2 2 0 0 0-2 2z">
                        </path>
                        <path d="M18 10H6v4h12v-4z"></path>
                    </svg>
                    <span>Strength</span>
                </div>
                <span class="card-badge">MMT</span>
            </div>
        </c-card-header>
        <c-card-body class="enhanced-card-body">
            <strength-n (formReady)="setChildForm('strength', $event)"
                [strengthData]="strengthData"></strength-n>
        </c-card-body>
    </c-card>

    <!--Neuro-Vascular-->
    <c-card class="mb-3 enhanced-card">
        <c-card-header class="enhanced-card-header neuro-header">
            <div class="card-header-content">
                <div class="card-header-title">
                    <svg class="card-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                    </svg>
                    <span>Neuro-Vascular</span>
                </div>
                <span class="card-badge">Neuro</span>
            </div>
        </c-card-header>
        <c-card-body class="enhanced-card-body">
            <neuro-vascular-n (formReady)="setChildForm('neuroVascular', $event)"></neuro-vascular-n>
        </c-card-body>
    </c-card>

    <!--Special Tests-->
    <c-card class="mb-3 enhanced-card">
        <c-card-header class="enhanced-card-header tests-header">
            <div class="card-header-content">
                <div class="card-header-title">
                    <svg class="card-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M9 11 4 6l5-5 5 5-5 5Z"></path>
                        <circle cx="11" cy="13" r="2"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <span>Special Tests</span>
                </div>
                <span class="card-badge">Tests</span>
            </div>
        </c-card-header>
        <c-card-body class="enhanced-card-body">
            <special-tests-n (formReady)="setChildForm('specialTest', $event)"></special-tests-n>
        </c-card-body>
    </c-card>

    <!--Palpation-->
    <c-card class="mb-3 enhanced-card">
        <c-card-header class="enhanced-card-header palpation-header">
            <div class="card-header-content">
                <div class="card-header-title">
                    <svg class="card-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
                        <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path>
                        <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
                        <path
                            d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15">
                        </path>
                    </svg>
                    <span>Palpation</span>
                </div>
                <span class="card-badge">Touch</span>
            </div>
        </c-card-header>
        <c-card-body class="enhanced-card-body">
            <palpation-n (formReady)="setChildForm('palpation', $event)"></palpation-n>
        </c-card-body>
    </c-card>
    <div class="action-buttons">
        <button cButton matStepperPrevious class="action-button back-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span>Back</span>
        </button>
        <button cButton class="action-button next-button" (click)="next()">
            <span>Next</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
    </div>
</div>
