<div class="button-container m-2">
    <c-input-group class="mb-3" style="max-width: 225px;">
        <select id="soapActionList" #soapActionList cSelect sizing="sm">
            <option value="back">Back to patient records</option>
            <option value="draft">Save as draft</option>
        </select>
        <button cButton color="primary" variant="outline" size="sm" (click)="soapActions(soapActionList.value)">
            <svg cIcon name="cilArrowCircleRight"></svg>
        </button>
    </c-input-group>
</div>
<form [formGroup]="dischargeForm" class="form-container">
    <div class="form-group">
        <label for="discharge-date">Date of Discharge:</label>
        <input cFormControl type="date" formControlName="dischargeDate" sizing="sm" style="max-width:193px;" />
    </div>

    <div class="form-group">
        <label for="visits">Number of Visits:</label>
        <input type="number" formControlName="numberOfVisits" />
    </div>

    <div class="form-group">
        <label>{{patientName}} been discharged from our care for the following reasons:</label>
        <textarea formControlName="reason" rows="8"></textarea>
        <span class="required">Required</span>
    </div>
</form>
<div class="mt-3 mb-3">
    <button cButton variant="outline" size="sm" class="mx-2" *appRoleScope="'forward-medical-note-role'; requireModify: true" (click)="toggleFrowardModal()">Forward</button>
    <button cButton variant="outline" size="sm" class="mx-2" *appRoleScope="'finalize-medical-note-role'; requireModify: true" (click)="finalize()">Finalize</button>
</div>
<c-modal id="foQMN" [visible]="forwardVisibility" backdrop="static">
    <c-modal-header>
        <strong>Forward Medical Note To :</strong>
        <button (click)="toggleFrowardModal()" cButtonClose></button>
    </c-modal-header>
    <c-modal-body>
        <forward-modal *ngIf="forwardVisibility" (changeVisibility)="changeVisibility($event)"
            [noteId]="noteId" [noteType]="noteType" [caseId]="caseId"
            (backToRecords)="backtoPatientRecordActions()"></forward-modal>
    </c-modal-body>
</c-modal>
<c-modal id="finalizeNote" [visible]="finalizeNoteVisibility" size="lg" backdrop="static">
    <c-modal-header>
        <h3 cModalTitle>Confirmation</h3>
        <button (click)="togglefinalize()" cButtonClose></button>
    </c-modal-header>
    <c-modal-body>
        <finalize-medical-note *ngIf="finalizeNoteVisibility" [patientCaseId]="caseId" [medicalNoteId]="medicalNoteId"
            [noteType]="noteType" (changeVisibility)="changeFinalizeNoteVisibility($event)"></finalize-medical-note>
    </c-modal-body>
</c-modal>
