<ngx-spinner type="ball-scale-multiple"></ngx-spinner>

<!-- Page Header -->
<c-row class="align-items-center mb-4">
  <c-col>
    <h2 class="fw-bold d-flex align-items-center gap-3">
      <!-- Larger, neutral-colored patient list icon -->
      <svg cIcon name="cilAddressBook" class="icon-large text-dark"></svg>
      Patient List
    </h2>
    <p class="text-muted mb-0">Browse, edit, and manage patient records</p>
  </c-col>
  <c-col class="text-end">
    <button cButton color="primary" class="shadow-sm px-4 py-2 rounded-pill" variant="outline" (click)="create()"
      dispaly-input [componentRole]="componentRole">
      <svg cIcon name="cilUserFollow" class="me-2"></svg>
      Create Patient
    </button>
  </c-col>
</c-row>

<!-- Search & Filters -->


<!-- Patient Table -->
<ng-container *ngIf="props$ | async as props">
  <c-card class="shadow-lg border-0 rounded-4 overflow-hidden">
    <c-card-body>
      <c-smart-table [columnSorter]="{ resetable: true }" [columns]="columns" [items]="(patient$ | async) ?? []"
        [itemsPerPage]="props.itemsPerPage" (itemsPerPageChange)="handleItemsPerPageChange($event)"
        [itemsPerPageOptions]="[5,10,20]" [itemsPerPageSelect]="true"
        [tableProps]="{ hover: true, striped: true, small:true, borderless: true }"
        [columnFilterValue]="props.columnFilterValue ?? []" [sorterValue]="props.sorterValue"
        [tableBodyProps]="{ align: 'middle' }" (sorterValueChange)="handleSorterValueChange($event)" header>
        <ng-template cTemplateId="tableData" let-columnName="columnName" let-item="item" let-tdContent="tdContent">
          <td>
            <ng-container [ngSwitch]="columnName">
              <ng-container *ngSwitchCase="'patientName'">
                <button cButton color="link" (click)="chart(item.id)">{{item.lastName + ',' + item.firstName}}</button>
              </ng-container>
              <ng-container *ngSwitchCase="'gender'">
                {{item.gender}}
              </ng-container>
              <ng-container *ngSwitchCase="'email'">
                {{item.contacts[0].email}}
              </ng-container>
              <ng-container *ngSwitchCase="'phone'">
                {{item.contacts[0].phoneNumber}}
              </ng-container>
              <ng-container *ngSwitchCase="'dateOfBirth'">
                {{item.birthDate | date :'MM/dd/yyyy'}}
              </ng-container>
              <ng-container *ngSwitchCase="'actions'">
                <div class="d-flex gap-3 justify-content-center">
                  <!-- Edit -->
                  <button cButton variant="ghost" color="info" (click)="edit(item)" class="action-btn-lg"
                    title="Edit Patient">
                    <svg cIcon name="cilPen" class="action-icon"></svg>
                  </button>
                </div>
              </ng-container>

              <ng-container *ngSwitchDefault>
                {{ tdContent }}
              </ng-container>
            </ng-container>
          </td>
        </ng-template>
      </c-smart-table>

      <!-- Pagination -->
      <div class="d-flex justify-content-center mt-4">
        <c-smart-pagination *ngIf="props.totalPages" [activePage]="props.activePage"
          (activePageChange)="handleActivePageChange($event)" [pages]="props.totalPages">
        </c-smart-pagination>
      </div>
    </c-card-body>
  </c-card>
</ng-container>

<!-- Error Alert -->
<ng-container *ngIf="errorMessage$ | async as errorMessage">
  <c-alert color="danger" class="mt-4 shadow-sm rounded-pill text-center fw-semibold">
    {{ errorMessage }}
  </c-alert>
</ng-container>

<!-- Edit Patient Modal -->
<c-modal id="editPateint" [visible]="editPatientVisibility" size="xl" [backdrop]="'static'">
  <c-modal-header>
    <h3 cModalTitle class="fw-bold text-primary d-flex align-items-center gap-2">
      <svg cIcon name="cilUser"></svg>
      Edit Patient
    </h3>
    <button (click)="toggleEditPatient()" cButtonClose></button>
  </c-modal-header>
  <c-modal-body>
    <app-create-patient [selectedPatient]="selectedPatient" *ngIf="editPatientVisibility"
      (changeVisibility)="changeFacilityVisibility($event)" [mode]="'update'">
    </app-create-patient>
  </c-modal-body>
</c-modal>
