<ngx-spinner type="ball-scale-multiple"></ngx-spinner>

<!-- Page Header Section -->
<div class="page-header">
  <div class="page-header-content">
    <div class="page-title-section">
      <h2 class="page-title">
        <svg cIcon name="cilAddressBook" class="page-icon"></svg>
        Patient List
      </h2>
      <p class="page-subtitle">Browse, edit, and manage patient records</p>
    </div>
  </div>
</div>

<!-- Patient Table Card -->
<ng-container *ngIf="props$ | async as props">
  <c-card class="patient-card">
    <div class="card-header-custom">
      <div class="card-header-title">
        <svg cIcon name="cilList" class="card-icon"></svg>
        <span>All Patients</span>
      </div>
      <span class="card-badge">
        {{ (patient$ | async)?.length || 0 }} Records
      </span>
    </div>
    <c-card-body class="card-body-custom">
      <c-smart-table
        [columnSorter]="{ resetable: true }"
        [columns]="columns"
        [items]="(patient$ | async) ?? []"
        [itemsPerPage]="props.itemsPerPage"
        (itemsPerPageChange)="handleItemsPerPageChange($event)"
        [itemsPerPageOptions]="[5,10,20]"
        [itemsPerPageSelect]="true"
        [tableProps]="{ hover: true, striped: true, small: true, borderless: true }"
        [columnFilterValue]="props.columnFilterValue ?? []"
        [sorterValue]="props.sorterValue"
        [tableBodyProps]="{ align: 'middle' }"
        (sorterValueChange)="handleSorterValueChange($event)"
        header>
        <ng-template cTemplateId="tableData" let-columnName="columnName" let-item="item" let-tdContent="tdContent">
          <td>
            <ng-container [ngSwitch]="columnName">
              <ng-container *ngSwitchCase="'patientName'">
                <button cButton class="patient-name-link" (click)="chart(item.id)">
                  <svg cIcon name="cilUser" class="patient-icon"></svg>
                  {{item.lastName + ', ' + item.firstName}}
                </button>
              </ng-container>
              <ng-container *ngSwitchCase="'gender'">
                <span class="gender-badge" [ngClass]="item.gender?.toLowerCase()">
                  {{item.gender}}
                </span>
              </ng-container>
              <ng-container *ngSwitchCase="'email'">
                <span class="contact-info">
                  <svg cIcon name="cilEnvelopeClosed" class="contact-icon"></svg>
                  {{item.contacts[0]?.email || '-'}}
                </span>
              </ng-container>
              <ng-container *ngSwitchCase="'phone'">
                <span class="contact-info">
                  <svg cIcon name="cilPhone" class="contact-icon"></svg>
                  {{item.contacts[0]?.phoneNumber || '-'}}
                </span>
              </ng-container>
              <ng-container *ngSwitchCase="'dateOfBirth'">
                <span class="dob-info">
                  {{item.birthDate | date :'MM/dd/yyyy'}}
                </span>
              </ng-container>
              <ng-container *ngSwitchCase="'actions'">
                <div class="action-buttons">
                  <button cButton class="action-btn-edit" (click)="edit(item)" title="Edit Patient">
                    <svg cIcon name="cilPen" class="action-icon"></svg>
                  </button>
                </div>
              </ng-container>

              <ng-container *ngSwitchDefault>
                {{ tdContent }}
              </ng-container>
            </ng-container>
          </td>
        </ng-template>
      </c-smart-table>

      <!-- Pagination -->
      <div class="pagination-container">
        <c-smart-pagination
          *ngIf="props.totalPages"
          [activePage]="props.activePage"
          (activePageChange)="handleActivePageChange($event)"
          [pages]="props.totalPages">
        </c-smart-pagination>
      </div>
    </c-card-body>
  </c-card>
</ng-container>

<!-- Error Alert -->
<ng-container *ngIf="errorMessage$ | async as errorMessage">
  <div class="error-alert">
    <svg cIcon name="cilWarning" class="error-icon"></svg>
    <span>{{ errorMessage }}</span>
  </div>
</ng-container>

<!-- Edit Patient Modal -->
<c-modal id="editPatient" [visible]="editPatientVisibility" size="xl" [backdrop]="'static'">
  <c-modal-header class="modal-header-custom">
    <h3 cModalTitle class="modal-title-custom">
      <svg cIcon name="cilUser" class="modal-icon"></svg>
      Edit Patient
    </h3>
    <button (click)="toggleEditPatient()" class="modal-close-btn">
      <svg cIcon name="cilX"></svg>
    </button>
  </c-modal-header>
  <c-modal-body class="modal-body-custom">
    <app-create-patient
      [selectedPatient]="selectedPatient"
      *ngIf="editPatientVisibility"
      (changeVisibility)="changeFacilityVisibility($event)"
      [mode]="'update'">
    </app-create-patient>
  </c-modal-body>
</c-modal>

<!-- Floating Action Button -->
<button class="fab-button" (click)="create()" dispaly-input [componentRole]="componentRole" title="Create New Patient">
  <svg cIcon name="cilPlus" class="fab-icon"></svg>
</button>
