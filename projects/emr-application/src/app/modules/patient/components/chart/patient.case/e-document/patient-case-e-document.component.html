<div class="e-document-form-card">
    <div class="form-header">
        <svg cIcon name="cilCloudUpload" class="header-icon"></svg>
        <span>Upload E-Document</span>
    </div>
    <div class="form-body">
        <form [formGroup]="eDocumentForm" (ngSubmit)="onSubmit()">
            <div class="form-row">
                <!-- Document Type -->
                <div class="form-group">
                    <label for="documentType" class="form-label">Document Type <span class="required">*</span></label>
                    <select id="documentType" formControlName="documentType" class="form-control"
                        [class.is-invalid]="eDocumentForm.get('documentType')?.invalid && eDocumentForm.get('documentType')?.touched">
                        <option value="">Select Document Type</option>
                        <option *ngFor="let type of documentTypes" [value]="type.value">
                            {{ type.name }}
                        </option>
                    </select>
                    <div class="invalid-feedback" *ngIf="eDocumentForm.get('documentType')?.invalid && eDocumentForm.get('documentType')?.touched">
                        Document Type is required
                    </div>
                </div>

                <!-- Name of Document -->
                <div class="form-group">
                    <label for="nameOfDocument" class="form-label">Name of Document <span class="required">*</span></label>
                    <input type="text" id="nameOfDocument" formControlName="nameOfDocument" class="form-control"
                        placeholder="Enter document name"
                        [class.is-invalid]="eDocumentForm.get('nameOfDocument')?.invalid && eDocumentForm.get('nameOfDocument')?.touched">
                    <div class="invalid-feedback" *ngIf="eDocumentForm.get('nameOfDocument')?.invalid && eDocumentForm.get('nameOfDocument')?.touched">
                        Name of Document is required
                    </div>
                </div>
            </div>

            <div class="form-row">
                <!-- Date of Receipt -->
                <div class="form-group">
                    <label for="dateOfReceipt" class="form-label">Date of Receipt <span class="required">*</span></label>
                    <input type="date" id="dateOfReceipt" formControlName="dateOfReceipt" class="form-control"
                        [class.is-invalid]="eDocumentForm.get('dateOfReceipt')?.invalid && eDocumentForm.get('dateOfReceipt')?.touched">
                    <div class="invalid-feedback" *ngIf="eDocumentForm.get('dateOfReceipt')?.invalid && eDocumentForm.get('dateOfReceipt')?.touched">
                        Date of Receipt is required
                    </div>
                </div>

                <!-- Assigned Case -->
                <div class="form-group">
                    <label for="assignedCase" class="form-label">Assigned Case <span class="required">*</span></label>
                    <select id="assignedCase" formControlName="assignedCase" class="form-control"
                        [class.is-invalid]="eDocumentForm.get('assignedCase')?.invalid && eDocumentForm.get('assignedCase')?.touched">
                        <option *ngFor="let caseOption of assignedCaseOptions" [value]="caseOption.value">
                            {{ caseOption.name }}
                        </option>
                    </select>
                    <div class="invalid-feedback" *ngIf="eDocumentForm.get('assignedCase')?.invalid && eDocumentForm.get('assignedCase')?.touched">
                        Assigned Case is required
                    </div>
                </div>
            </div>

            <!-- File Upload -->
            <div class="form-row">
                <div class="form-group full-width">
                    <label class="form-label">Upload Document <span class="required">*</span></label>
                    <div class="file-upload-container" [class.has-file]="selectedFile">
                        <input type="file" id="documentFile" class="file-input"
                            (change)="onFileSelected($event)"
                            accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.gif,.xls,.xlsx">
                        <label for="documentFile" class="file-upload-label" *ngIf="!selectedFile">
                            <svg cIcon name="cilCloudUpload" class="upload-icon"></svg>
                            <span class="upload-text">Click to upload or drag and drop</span>
                            <span class="upload-hint">PDF, DOC, DOCX, JPG, PNG, XLS (max 10MB)</span>
                        </label>
                        <div class="file-selected" *ngIf="selectedFile">
                            <svg cIcon name="cilFile" class="file-icon"></svg>
                            <span class="file-name">{{ selectedFileName }}</span>
                            <button type="button" class="remove-file-btn" (click)="removeFile()">
                                <svg cIcon name="cilX"></svg>
                            </button>
                        </div>
                    </div>
                    <div class="invalid-feedback" *ngIf="!selectedFile && eDocumentForm.touched">
                        Document file is required
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" (click)="onCancel()">
                    <svg cIcon name="cilX"></svg>
                    Cancel
                </button>
                <button type="submit" class="btn-submit" [disabled]="eDocumentForm.invalid || !selectedFile">
                    <svg cIcon name="cilSave"></svg>
                    Save Document
                </button>
            </div>
        </form>
    </div>
</div>
