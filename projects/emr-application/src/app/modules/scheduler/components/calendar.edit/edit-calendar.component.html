<ngx-spinner></ngx-spinner>
<c-row class="mb-2">
    <c-col xl="12">
        <label style="width: 150px;">Name <span class="text-danger">*</span></label>
    </c-col>
    <c-col xl="12">
        <input class="form-control" placeholder sizing="sm" maxlength="60" input-trimmer name="claendar-name" required
            [value]="calendar.name" #claendarName>
    </c-col>
</c-row>
<div class="mt-3 text-center">
    <button cButton size="sm" variant="outline" class="mx-2" (click)="edit()"
        [disabled]="calendar.name === ''">Edit</button>
</div>
