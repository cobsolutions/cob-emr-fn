<!-- Daily Repetition -->
<div class="repetition-panel" *ngIf="configuration.appointmentRepetitionType === 'Daily'">
  <div class="panel-header">
    <div class="panel-title">
      <svg cIcon name="cilCalendar" class="panel-icon"></svg>
      <span>Daily Repetition Settings</span>
    </div>
    <span class="panel-badge">
      <svg cIcon name="cilSync" class="badge-icon"></svg>
      Daily
    </span>
  </div>
  <div class="panel-body">
    <div class="config-grid">
      <div class="config-group">
        <label class="config-label">
          <svg cIcon name="cilReload" class="label-icon"></svg>
          Repeat Every <span class="label-hint">(days)</span>
        </label>
        <div class="input-wrapper">
          <input cFormControl type="number"
            [(ngModel)]="dailyRepeatAppointment.every"
            placeholder="e.g., 1"
            [disabled]="appointmentSkeleton === 1"
            class="number-input" />
          <span class="input-suffix">day(s)</span>
        </div>
      </div>
      <div class="config-group">
        <label class="config-label">
          <svg cIcon name="cilCalendar" class="label-icon"></svg>
          Start Date
        </label>
        <c-date-picker closeOnSelect
          [placeholder]="'Select start date'"
          [ngModel]="dailyRepeatAppointment._dateStart"
          (dateChange)="changeDailyStartDate($event)"
          [disabled]="appointmentSkeleton === 1">
        </c-date-picker>
      </div>
      <div class="config-group">
        <label class="config-label">
          <svg cIcon name="cilCalendar" class="label-icon"></svg>
          End Date
        </label>
        <c-date-picker closeOnSelect
          [placeholder]="'Select end date'"
          [ngModel]="dailyRepeatAppointment._dateEnd"
          (dateChange)="changeDailyEndDate($event)"
          [disabled]="appointmentSkeleton === 1">
        </c-date-picker>
      </div>
    </div>
  </div>
</div>

<!-- Weekly Repetition -->
<div class="repetition-panel" *ngIf="configuration.appointmentRepetitionType === 'Weekly'">
  <div class="panel-header">
    <div class="panel-title">
      <svg cIcon name="cilCalendar" class="panel-icon"></svg>
      <span>Weekly Repetition Settings</span>
    </div>
    <span class="panel-badge weekly">
      <svg cIcon name="cilSync" class="badge-icon"></svg>
      Weekly
    </span>
  </div>
  <div class="panel-body">
    <div class="config-grid">
      <div class="config-group">
        <label class="config-label">
          <svg cIcon name="cilReload" class="label-icon"></svg>
          Repeat Every <span class="label-hint">(weeks)</span>
        </label>
        <div class="input-wrapper">
          <input cFormControl type="number"
            placeholder="e.g., 1"
            [(ngModel)]="weeklyRepeatAppointment.every"
            [disabled]="appointmentSkeleton === 1"
            class="number-input" />
          <span class="input-suffix">week(s)</span>
        </div>
      </div>
      <div class="config-group full-width">
        <label class="config-label">
          <svg cIcon name="cilListRich" class="label-icon"></svg>
          Days of Week
        </label>
        <c-multi-select cFormControl cSelect
          multiple
          [(ngModel)]="weeklyRepeatAppointment.days"
          [disabled]="appointmentSkeleton === 1"
          placeholder="Select days...">
          <c-multi-select-option *ngFor="let day of days"
            [selected]="day.selected"
            [value]="day.dayNumber.toString()">
            {{ day.dayName }}
          </c-multi-select-option>
        </c-multi-select>
      </div>
      <div class="config-group">
        <label class="config-label">
          <svg cIcon name="cilCalendar" class="label-icon"></svg>
          Start Date
        </label>
        <c-date-picker closeOnSelect
          [placeholder]="'Select start date'"
          [ngModel]="weeklyRepeatAppointment._dateStart"
          (dateChange)="changeWeeklyStartDate($event)"
          [disabled]="appointmentSkeleton === 1">
        </c-date-picker>
      </div>
      <div class="config-group">
        <label class="config-label">
          <svg cIcon name="cilCalendar" class="label-icon"></svg>
          End Date
        </label>
        <c-date-picker closeOnSelect
          [placeholder]="'Select end date'"
          [ngModel]="weeklyRepeatAppointment._dateEnd"
          (dateChange)="changeWeeklyEndDate($event)"
          [disabled]="appointmentSkeleton === 1">
        </c-date-picker>
      </div>
    </div>
  </div>
</div>
