<h2 mat-dialog-title>Add Appointment</h2>
<mat-dialog-content class="mat-typography">

  <app-appointment-add #appointmentAddComponent [startDate]="data.startDate"></app-appointment-add>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button cButton (click)="create()">Create</button>
  <button cButton (click)="cancel()">Cancel</button>
</mat-dialog-actions>
