<!-- Modal Header -->
<div class="modal-header">
  <div class="modal-title-section">
    <div class="modal-icon-wrapper">
      <svg cIcon name="cilCalendarCheck" class="modal-icon"></svg>
    </div>
    <div class="modal-title-content">
      <h2 class="modal-title">Add Appointment</h2>
      <p class="modal-subtitle">Create a new appointment entry</p>
    </div>
  </div>
  <button class="close-btn" (click)="cancel()" type="button">
    <svg cIcon name="cilX" class="close-icon"></svg>
  </button>
</div>

<!-- Modal Content -->
<mat-dialog-content class="modal-content">
  <app-appointment-add #appointmentAddComponent
    [startDate]="data.startDate"
    [calendarId]="data.calendarId"
    [module]="module"
    [showHeader]="false"
    [schedulerSettings]="data.schedulerSettings">
  </app-appointment-add>
</mat-dialog-content>

<!-- Modal Footer -->
<mat-dialog-actions class="modal-footer">
  <div class="footer-hint">
    <svg cIcon name="cilInfo" class="hint-icon"></svg>
    <span>Fill in all required fields to create the appointment</span>
  </div>
  <div class="footer-actions">
    <button class="btn-cancel" (click)="cancel()" type="button">
      <svg cIcon name="cilX" class="btn-icon"></svg>
      <span>Cancel</span>
    </button>
    <button class="btn-create" (click)="create()" type="button">
      <svg cIcon name="cilCheck" class="btn-icon"></svg>
      <span>Create Appointment</span>
    </button>
  </div>
</mat-dialog-actions>
