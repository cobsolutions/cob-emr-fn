<!-- Modal Header -->
<div class="modal-header">
  <div class="modal-title-section">
    <div class="modal-icon-wrapper">
      <svg cIcon name="cilCalendarCheck" class="modal-icon"></svg>
    </div>
    <div class="modal-title-content">
      <h2 class="modal-title">Add Appointment</h2>
      <p class="modal-subtitle">Create a new appointment entry</p>
    </div>
  </div>
  <button class="close-btn" (click)="cancel()" type="button">
    <svg cIcon name="cilX" class="close-icon"></svg>
  </button>
</div>

<!-- Modal Content -->
<mat-dialog-content class="modal-content">
  <app-appointment-add #appointmentAddComponent
    [startDate]="data.startDate"
    [calendarId]="data.calendarId"
    [module]="module"
    [showHeader]="false"
    [schedulerSettings]="data.schedulerSettings"
    (createClicked)="create()"
    (cancelClicked)="cancel()">
  </app-appointment-add>
</mat-dialog-content>
