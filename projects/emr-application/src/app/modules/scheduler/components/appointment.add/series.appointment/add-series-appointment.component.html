<c-spinner color="dark" variant="grow" *ngIf="isLoading"></c-spinner>
<c-container fluid *ngIf="!isLoading">
    <!-- Appointment For-->
    <c-row class="justify-content-center">
        <c-col>
            <c-card class="mb-3 ustify-content-center">
                <c-card-header><strong>Appointment for</strong></c-card-header>
            </c-card>
            <c-card-body>
                <select cFormControl cSelect class="mb-2" sizing="sm" id="patientcase" name="patientcase"
                    [compareWith]="compareFn"
                    [ngClass]="{'is-invalid': patientcase.invalid && (patientcase.dirty || patientcase.touched)}"
                    [(ngModel)]="selectedPatientCase" #patientcase="ngModel" required>
                    <option *ngFor="let case of selectedPateint?.cases" [ngValue]="case">
                        {{case.title}}
                    </option>
                </select>
            </c-card-body>
        </c-col>
    </c-row>
    <!-- Appointment Date -->
    <c-row>
        <c-col>
            <c-card class="mb-3 ustify-content-center">
                <c-card-header>
                    <strong>Appointment at</strong>
                </c-card-header>
                <c-card-body></c-card-body>
            </c-card>
        </c-col>
    </c-row>
    <!-- Clinic-->
    <c-row class="justify-content-center">
        <c-col>
            <c-card class="mb-3 ustify-content-center">
                <c-card-header><strong>Clinic</strong></c-card-header>
                <c-card-body></c-card-body>
            </c-card>
        </c-col>
    </c-row>
    <!--Therapists-->
    <c-row>
        <c-col>
            <c-card class="mb-3 ustify-content-center">
                <c-card-header><strong>Therapist</strong></c-card-header>
                <c-card-body></c-card-body>
            </c-card>
        </c-col>
    </c-row>
    <!--Appointment Repetition-->
    <c-row>
        <c-col>
            <c-card class="mb-3 ustify-content-center">
                <c-card-header><strong>Appointment Repetition</strong></c-card-header>
                <c-card-body></c-card-body>
            </c-card>
        </c-col>
    </c-row>
