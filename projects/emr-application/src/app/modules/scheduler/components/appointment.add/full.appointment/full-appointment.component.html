<c-container fluid>
    <!-- Appointment For-->
    <c-row class="justify-content-center">
        <c-col>
            <c-card class="mb-3 ustify-content-center">
                <c-card-header><strong>Appointment for</strong></c-card-header>
                <c-card-body>
                    <select cFormControl cSelect class="mb-2" sizing="sm" id="patients" name="patients"
                        [ngClass]="{'is-invalid': patients.invalid && (patients.dirty || patients.touched)}"
                        [(ngModel)]="appointment.patient" #patients="ngModel" (ngModelChange)="onCaseSelected($event)"
                        required>
                        <option *ngFor="let patient of patientsList" [ngValue]="patient">
                            {{patient.displayName}}
                        </option>
                    </select>
                    <select cFormControl cSelect class="mb-2" sizing="sm" id="patientcase" name="patientcase"
                        [compareWith]="compareFn"
                        [ngClass]="{'is-invalid': patientcase.invalid && (patientcase.dirty || patientcase.touched)}"
                        [(ngModel)]="appointment.patientCase" #patientcase="ngModel"
                        (ngModelChange)="onCaseSelected($event)" required>
                        <option *ngFor="let case of appointment.patient?.cases" [ngValue]="case">
                            {{case.title}}
                        </option>
                    </select>
                </c-card-body>
            </c-card>
        </c-col>
    </c-row>
    <!-- Appointment Date -->
    <c-row>
        <c-col>
            <c-card class="mb-3 ustify-content-center">
                <c-card-header><strong>Appointment at</strong></c-card-header>
                <c-card-body>
                    <div *ngIf="!validDate">
                        <small class="form-text text-danger">
                            Appointment start time cant greater than appointment end time
                        </small>
                    </div>
                    <div class="mb-1">
                        <c-row>
                            <c-col xs="8"><c-date-picker size="sm" [date]="appointment.appointmentDate.startDate"
                                    name="startDate" [(ngModel)]="appointment.appointmentDate.startDate"
                                    (dateChange)="changestartDate($event)"></c-date-picker></c-col>
                            <c-col xs="4"><c-time-picker size="sm" id="startTime" name="startTime"
                                    [(ngModel)]="appointment.appointmentDate.startTime"></c-time-picker></c-col>
                        </c-row>
                    </div>
                    <c-row>
                        <c-col xs="8"><c-date-picker size="sm" [date]="appointment.appointmentDate.endDate"
                                name="endDate"
                                [(ngModel)]="appointment.appointmentDate.endDate"></c-date-picker></c-col>
                        <c-col xs="4"><c-time-picker size="sm" id="endTime" name="endTime"
                                [(ngModel)]="appointment.appointmentDate.endTime"></c-time-picker></c-col>
                    </c-row>
                </c-card-body>
            </c-card>
        </c-col>
    </c-row>
    <!-- Clinic-->
    <c-row class="justify-content-center">
        <c-col>
            <c-card class="mb-3 ustify-content-center">
                <c-card-header><strong>Clinic</strong></c-card-header>
                <c-card-body>
                    <div class="mb-1">
                        <div *ngIf="appointment.patient?.clinicModels?.length ===1">
                            <input cFormControl [value]="appointment.patient?.clinicModels[0].name" sizing="sm"
                                disabled="true">
                        </div>
                        <div *ngIf="appointment.patient?.clinicModels?.length >1">
                            <small
                                *ngIf="(patientclinic.errors) || (patientclinic.invalid && (patientclinic.dirty || patientclinic.touched))"
                                class="form-text text-danger">
                                Clinic is required
                            </small>
                            <select cFormControl cSelect class="mb-2" sizing="sm" id="patientclinic"
                                name="patientclinic"
                                [ngClass]="{'is-invalid': patientclinic.invalid && (patientclinic.dirty || patientclinic.touched)}"
                                [(ngModel)]="appointment.clinicId" #patientclinic="ngModel" required>
                                <option [ngValue]="null" disabled selected>Select Clinic</option>
                                <option *ngFor="let clinic of appointment.patient?.clinicModels" [value]="clinic.id"
                                    [selected]="appointment.clinicId">
                                    {{clinic.name}}
                                </option>
                            </select>
                        </div>
                    </div>
                </c-card-body>
            </c-card>
        </c-col>
    </c-row>
    <!--Therapists-->
    <c-row *ngIf="therapists">
        <c-col>
            <c-card class="mb-3 ustify-content-center">
                <c-card-header><strong>Therapist</strong></c-card-header>
                <c-card-body>
                    <select cFormControl cSelect class="mb-2" sizing="sm" id="appTherapy" name="appTherapy"
                        [ngClass]="{'is-invalid': appTherapy.invalid && (appTherapy.dirty || appTherapy.touched)}"
                        [(ngModel)]="appointment.therapyUUID" #appTherapy="ngModel" required>
                        <option [ngValue]="null" disabled selected>Select Therapy</option>
                        <option *ngFor="let therapy of this.therapists" [value]="therapy.uuid">
                            {{therapy.lastName +', ' + therapy.firstName}}
                        </option>
                    </select>
                </c-card-body>
            </c-card>
        </c-col>
    </c-row>
    <!-- Appointment Type-->
    <c-row>
        <c-col>
            <c-card class="mb-3 ustify-content-center">
                <c-card-header><strong>Appointment Type</strong></c-card-header>
                <c-card-body>
                    <select cFormControl cSelect class="mb-2" sizing="sm" id="apptype" name="apptype"
                        [ngClass]="{'is-invalid': apptype.invalid && (apptype.dirty || apptype.touched)}"
                        [(ngModel)]="appointment.appointmentTypeId" #apptype="ngModel" required>
                        <option *ngFor="let type of appointmentTypes
                        " [value]="type.id">
                            {{type.name}}
                        </option>
                    </select>
                    <textarea cFormControl id="exampleFormControlTextarea1" rows="2" id="appointmentnote"
                        name="appointmentnote" [(ngModel)]="appointment.note" placeholder="Appointment Note"></textarea>
                </c-card-body>
            </c-card>
        </c-col>
    </c-row>
    <!--Appointment Repetition-->
    <c-row>
        <c-col>
            <c-card class="mb-3 ustify-content-center">
                <c-card-header><strong>Appointment Repetition</strong></c-card-header>
                <c-card-body>
                    <select cFormControl cSelect class="mb-2" sizing="sm" id="repetition" name="repetition"
                        [ngClass]="{'is-invalid': repetition.invalid && (repetition.dirty || repetition.touched)}"
                        [(ngModel)]="appointment.appointmentRepetitionType" #repetition="ngModel">
                        <option [ngValue]="'Single'" selected>Don't Repeat</option>
                        <option [ngValue]="'Daily'" selected>Daily</option>
                        <option [ngValue]="'Weekly'" selected>Weekly</option>
                        <option [ngValue]="'Monthly'" selected>Monthly</option>
                        <option [ngValue]="'Yearly'" selected>Yearly</option>
                        <!-- <option [ngValue]="'Every_Week_Day'" selected>Every Week Day</option> -->
                    </select>
                    <repeat-appointment #repeatAppointmentComponent *ngIf="appointment.appointmentRepetitionType"
                        [repeatType]="appointment.appointmentRepetitionType"></repeat-appointment>
                </c-card-body>
            </c-card>
        </c-col>
    </c-row>
</c-container>
