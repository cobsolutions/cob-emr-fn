<c-container fluid>
    <c-row class="justify-content-center">
        <c-col>
            <c-card class="mb-3 ustify-content-center">
                <c-card-header><strong>Appointment for</strong></c-card-header>
                <c-card-body>
                    <select cFormControl cSelect class="mb-2" sizing="sm" id="patients" name="patients"
                        [ngClass]="{'is-invalid': patients.invalid && (patients.dirty || patients.touched)}"
                        [(ngModel)]="appointment.patient" #patients="ngModel" (ngModelChange)="onCaseSelected($event)"
                        required>
                        <option *ngFor="let patient of patientsList" [ngValue]="patient">
                            {{patient.displayName}}
                        </option>
                    </select>
                    <select cFormControl cSelect class="mb-2" sizing="sm" id="patientcase" name="patientcase"
                        [compareWith]="compareFn"
                        [ngClass]="{'is-invalid': patientcase.invalid && (patientcase.dirty || patientcase.touched)}"
                        [(ngModel)]="appointment.patientCase" #patientcase="ngModel"
                        (ngModelChange)="onCaseSelected($event)" required>
                        <option *ngFor="let case of appointment.patient?.cases" [ngValue]="case">
                            {{case.title}}
                        </option>
                    </select>
                </c-card-body>
            </c-card>
        </c-col>
    </c-row>
    <c-row class="justify-content-center">
        <c-col>
            <c-card class="mb-3 ustify-content-center">
                <c-card-header><strong>Clinic</strong></c-card-header>
                <c-card-body>
                    <div class="mb-1">
                        <div *ngIf="appointment.patient?.clinicModels?.length ===1">
                            <input cFormControl [value]="appointment.patient?.clinicModels[0].name"
                                 sizing="sm" disabled="true">
                        </div>
                        <div *ngIf="appointment.patient?.clinicModels?.length >1">
                            <small
                                *ngIf="(patientclinic.errors) || (patientclinic.invalid && (patientclinic.dirty || patientclinic.touched))"
                                class="form-text text-danger">
                                Clinic is required
                            </small>
                            <select cFormControl cSelect class="mb-2" sizing="sm" id="patientclinic"
                                name="patientclinic"
                                [ngClass]="{'is-invalid': patientclinic.invalid && (patientclinic.dirty || patientclinic.touched)}"
                                [(ngModel)]="appointment.clinicId" #patientclinic="ngModel" required>
                                <option [ngValue]="null" disabled selected>Select Clinic</option>
                                <option *ngFor="let clinic of appointment.patient?.clinicModels" [value]="clinic.id"
                                    [selected]="appointment.clinicId">
                                    {{clinic.name}}
                                </option>
                            </select>
                        </div>
                    </div>
                </c-card-body>
            </c-card>
        </c-col>
    </c-row>
    <c-row>
        <c-col>
            <c-card class="mb-3 ustify-content-center">
                <c-card-header><strong>Therapist</strong></c-card-header>
                <c-card-body>
                    <select cFormControl cSelect class="mb-2" sizing="sm" id="appTherapy" name="appTherapy"
                        [ngClass]="{'is-invalid': appTherapy.invalid && (appTherapy.dirty || appTherapy.touched)}"
                        [(ngModel)]="appointment.therapyUUID" #appTherapy="ngModel" required>
                        <option [ngValue]="null" disabled selected>Select Therapy</option>
                        <option *ngFor="let therapy of this.therapists$ | async" [value]="therapy.uuid">
                            {{therapy.accountName}}
                        </option>
                    </select>
                </c-card-body>
            </c-card>
        </c-col>
    </c-row>
</c-container>
