<c-row class="justify-content-center">
    <c-col>
        <c-card class="mb-3 ustify-content-center">
            <c-card-header><strong>Appointment for</strong></c-card-header>
            <c-card-body>
                <c-row class="justify-content-center">
                    <c-col>
                        <c-card class="mb-3 ustify-content-center">
                            <c-card-header>
                                <strong>Appointment for</strong>
                            </c-card-header>
                            <c-card-body>
                                <div class="mb-3">
                                    <label cLabel for="appointmentWhat">What <strong
                                            class="text-danger">*</strong></label>
                                    <input cFormControl id="appointmentWhat" sizing="sm"
                                        [(ngModel)]="appointmentBlockSeries.title" />
                                </div>
                            </c-card-body>
                        </c-card>
                    </c-col>
                </c-row>
            </c-card-body>
        </c-card>
    </c-col>
</c-row>
<c-row>
    <c-col>
        <c-card class="mb-3 ustify-content-center">
            <c-card-header>
                <strong>Appointment at</strong>
            </c-card-header>
            <c-card-body>
                <div class="mb-1">
                    <c-row>
                        <label>start</label>
                        <c-col xs="11">
                            <c-time-picker size="sm" id="startTime" name="startTime"
                                [(ngModel)]="startTime"></c-time-picker>
                        </c-col>
                    </c-row>
                </div>
                <div class="mb-1">
                    <c-row>
                        <label>end</label>
                        <c-col xs="11">
                            <c-time-picker size="sm" id="startTime" name="startTime"
                                [(ngModel)]="endTime"></c-time-picker>
                        </c-col>
                    </c-row>
                </div>
            </c-card-body>
        </c-card>
    </c-col>
</c-row>
<c-row class="justify-content-center">
    <c-col>
        <c-card class="mb-3 ustify-content-center">
            <c-card-header><strong>Clinic</strong></c-card-header>
            <c-card-body>
                <div class="mb-1">
                    <input cFormControl [value]="appointmentBlockSeries.clinic.name" sizing="sm" disabled="true">
                </div>
            </c-card-body>
        </c-card>
    </c-col>
</c-row>
<!-- Appointment Type-->
<c-row>
    <c-col>
        <c-card class="mb-3 ustify-content-center">
            <c-card-header><strong>Appointment Type</strong></c-card-header>
            <c-card-body>
                <select cFormControl cSelect class="mb-2" sizing="sm" id="apptype" name="apptype"
                    [ngClass]="{'is-invalid': apptype.invalid && (apptype.dirty || apptype.touched)}"
                    [(ngModel)]="appointmentBlockSeries.appointmentType.id" #apptype="ngModel" required>
                    <option *ngFor="let type of appointmentTypes
                    " [value]="type.id">
                        {{type.name}}
                    </option>
                </select>
                <textarea cFormControl id="exampleFormControlTextarea1" rows="2" id="appointmentnote"
                    name="appointmentnote" [(ngModel)]="appointmentBlockSeries.note"
                    placeholder="Appointment Note"></textarea>
            </c-card-body>
        </c-card>
    </c-col>
</c-row>
