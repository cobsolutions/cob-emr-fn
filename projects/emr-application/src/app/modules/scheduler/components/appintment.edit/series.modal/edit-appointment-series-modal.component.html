<h2 mat-dialog-title>Edit Appointment</h2>
<mat-dialog-content class="mat-typography">
  <c-spinner color="dark" variant="grow" *ngIf="isLoading"></c-spinner>
  <c-container fluid *ngIf="!isLoading">
    <full-series-appointment *ngIf="appointmentStrucutreType ==='Full' && appointmentFullSeries"
      [appointmentFullSeries]="appointmentFullSeries" #fullSeriesAppointmentComponent></full-series-appointment>

    <block-series-appointment *ngIf="appointmentStrucutreType ==='Block' && appointmentBlockSeries"
      [appointmentBlockSeries]="appointmentBlockSeries" #BlockSeriesAppointmentComponent></block-series-appointment>
  </c-container>
</mat-dialog-content>
<mat-dialog-actions align="end" *ngIf="data.event.id">
  <button cButton (click)="update()" class="mx-3" variant="outline">Update</button>
  <button cButton (click)="cancel()" variant="outline">Cancel</button>
</mat-dialog-actions>
