<!-- Appointment For -->
<c-row class="justify-content-center">
    <c-col>
        <c-card class="mb-3 ustify-content-center">
            <c-card-header><strong>Appointment for</strong></c-card-header>
            <c-card-body>
                <select cFormControl cSelect class="mb-2" sizing="sm" id="patientcase" name="patientcase"
                    [compareWith]="compareFn"
                    [ngClass]="{'is-invalid': patientcase.invalid && (patientcase.dirty || patientcase.touched)}"
                    [(ngModel)]="appointmentFullSeries.patientCase" #patientcase="ngModel" required>
                    <option *ngFor="let case of appointmentFullSeries?.patientCases" [ngValue]="case">
                        {{case.title}}
                    </option>
                </select>
            </c-card-body>
        </c-card>
    </c-col>
</c-row>
<!--Date-->
<c-row>
    <c-col>
        <c-card class="mb-3 ustify-content-center">
            <c-card-header>
                <strong>Appointment at</strong>
            </c-card-header>
            <c-card-body>
                <div class="mb-1">
                    <c-row>
                        <label>start</label>
                        <c-col xs="11">
                            <c-time-picker size="sm" id="startTime" name="startTime"
                                [(ngModel)]="startTime"></c-time-picker>
                        </c-col>
                    </c-row>
                </div>
                <div class="mb-1">
                    <c-row>
                        <label>end</label>
                        <c-col xs="11">
                            <c-time-picker size="sm" id="startTime" name="startTime"
                                [(ngModel)]="endTime"></c-time-picker>
                        </c-col>
                    </c-row>
                </div>
            </c-card-body>
        </c-card>
    </c-col>
</c-row>
<!-- Clinic-->
<c-row class="justify-content-center">
    <c-col>
        <c-card class="mb-3 ustify-content-center">
            <c-card-header><strong>Clinic</strong></c-card-header>
            <c-card-body>
                <div *ngIf="appointmentFullSeries.patientClinics.length ===1">
                    <label>{{appointmentFullSeries.clinic.name}}</label>
                </div>
                <div *ngIf="appointmentFullSeries.patientClinics.length >1">
                    <select cFormControl cSelect class="mb-2" sizing="sm" id="patientclinic" name="patientclinic"
                        [compareWith]="compareFn"
                        [ngClass]="{'is-invalid': patientclinic.invalid && (patientclinic.dirty || patientclinic.touched)}"
                        [(ngModel)]="appointmentFullSeries.clinic" #patientclinic="ngModel" required>
                        <option *ngFor="let clinic of appointmentFullSeries.patientClinics" [ngValue]="clinic">
                            {{clinic.name}}
                        </option>
                    </select>
                </div>
            </c-card-body>
        </c-card>
    </c-col>
</c-row>
<!--Therapists-->
<c-row *ngIf="therapists">
    <c-col>
        <c-card class="mb-3 ustify-content-center">
            <c-card-header><strong>Therapist</strong></c-card-header>
            <c-card-body>
                <select cFormControl cSelect class="mb-2" sizing="sm" id="appTherapy" name="appTherapy"
                    [ngClass]="{'is-invalid': appTherapy.invalid && (appTherapy.dirty || appTherapy.touched)}"
                    [(ngModel)]="appointmentFullSeries.therapy" #appTherapy="ngModel" required>
                    <option *ngFor="let therapy of this.therapists" [value]="therapy.uuid">
                        {{therapy.lastName +', ' + therapy.firstName }}
                    </option>
                </select>
            </c-card-body>
        </c-card>
    </c-col>
</c-row>
<!-- Appointment Type-->
<c-row>
    <c-col>
        <c-card class="mb-3 ustify-content-center">
            <c-card-header><strong>Appointment Type</strong></c-card-header>
            <c-card-body>
                <select cFormControl cSelect class="mb-2" sizing="sm" id="apptype" name="apptype"
                    [ngClass]="{'is-invalid': apptype.invalid && (apptype.dirty || apptype.touched)}"
                    [(ngModel)]="appointmentFullSeries.appointmentType.id" #apptype="ngModel" required>
                    <option *ngFor="let type of appointmentTypes
                    " [value]="type.id">
                        {{type.name}}
                    </option>
                </select>
                <textarea cFormControl id="exampleFormControlTextarea1" rows="2" id="appointmentnote"
                    name="appointmentnote" [(ngModel)]="appointmentFullSeries.note"
                    placeholder="Appointment Note"></textarea>
            </c-card-body>
        </c-card>
    </c-col>
</c-row>
