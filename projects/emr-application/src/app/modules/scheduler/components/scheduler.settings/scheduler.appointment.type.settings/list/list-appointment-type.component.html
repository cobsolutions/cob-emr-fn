<div class="appt-type-container">
    <!-- Toolbar -->
    <div class="appt-type-toolbar">
        <div class="toolbar-info">
            <span class="toolbar-label">Appointment Types</span>
        </div>
        <button cButton class="create-btn" (click)="openCreateModal()" *appRoleScope="'calendar-role'; requireModify: true">
            <svg cIcon name="cilPlus" class="btn-icon"></svg>
            Create Type
        </button>
    </div>

    <!-- Table -->
    <div class="table-wrapper">
        <table cTable class="appt-type-table">
            <thead>
                <tr>
                    <th scope="col">Name</th>
                    <th scope="col">Background Color</th>
                    <th scope="col">Font Color</th>
                    <th scope="col" class="actions-col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let type of (appointmentTypes | async)">
                    <td class="name-cell">{{ type.name }}</td>
                    <td>
                        <div class="color-preview">
                            <span class="color-swatch" [style.background]="type.color"></span>
                            <span class="color-value">{{ type.color }}</span>
                        </div>
                    </td>
                    <td>
                        <div class="color-preview">
                            <span class="color-swatch" [style.background]="type.fontColor"></span>
                            <span class="color-value">{{ type.fontColor }}</span>
                        </div>
                    </td>
                    <td class="actions-col" *appRoleScope="'calendar-role'; requireModify: true">
                        <button cButton class="edit-btn" (click)="openEditModal(type)" cTooltip="Edit" cTooltipPlacement="left">
                            <svg cIcon name="cilPen" class="edit-icon"></svg>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add Modal -->
<c-modal id="addAppoitmentType" [visible]="addVisibility" size="lg" backdrop="static">
    <c-modal-header class="modal-header-custom">
        <h3 cModalTitle class="modal-title-custom">
            <svg cIcon name="cilPlus" class="modal-title-icon"></svg>
            Add Appointment Type
        </h3>
        <button (click)="toggleAdd()" cButtonClose></button>
    </c-modal-header>
    <c-modal-body>
        <apd-appointment-type *ngIf="addVisibility"
            (changeVisibility)="changeAddModalVisibility($event)"></apd-appointment-type>
    </c-modal-body>
</c-modal>

<!-- Edit Modal -->
<c-modal id="editAppoitmentType" [visible]="editVisibility" size="lg" backdrop="static">
    <c-modal-header class="modal-header-custom">
        <h3 cModalTitle class="modal-title-custom">
            <svg cIcon name="cilPen" class="modal-title-icon"></svg>
            Edit Appointment Type
        </h3>
        <button (click)="toggleEdit()" cButtonClose></button>
    </c-modal-header>
    <c-modal-body>
        <edit-appointment-type *ngIf="editVisibility" (changeVisibility)="changeEditModalVisibility($event)"
            [selectedType]="selectedtype"></edit-appointment-type>
    </c-modal-body>
</c-modal>
