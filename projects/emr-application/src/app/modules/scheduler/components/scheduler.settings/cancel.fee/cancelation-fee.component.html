<div class="cancel-fee-container">
  <form cForm #cancelFeeForm="ngForm">
    <!-- Toggle Switch -->
    <div class="toggle-row">
        <div class="toggle-content">
            <c-form-check [switch]="true">
                <input cFormCheckInput type="checkbox" id="enableCancelFee" name="enableCancelFee"
                    [(ngModel)]="patientCancellationFee.isEnabled" />
                <label cFormCheckLabel for="enableCancelFee" class="toggle-label">Apply cancellation fee</label>
            </c-form-check>
            <p class="toggle-hint">When enabled, patients will be charged a fee for late cancellations.</p>
        </div>
    </div>

    <!-- Fee Fields -->
    <div class="form-grid" [class.fields-disabled]="!patientCancellationFee.isEnabled">
        <!-- Fee Amount -->
        <div class="form-field">
            <label class="field-label">Fee Amount</label>
            <div class="input-with-prefix">
                <span class="input-prefix">$</span>
                <input cFormControl type="number" placeholder="0.00" name="amount"
                    [disabled]="!patientCancellationFee.isEnabled"
                    [(ngModel)]="patientCancellationFee.amount" />
            </div>
        </div>

        <!-- Fee Duration -->
        <div class="form-field">
            <label class="field-label">Cancellation Window</label>
            <div class="input-with-suffix">
                <input cFormControl type="number" placeholder="0" name="duration"
                    [disabled]="!patientCancellationFee.isEnabled"
                    [(ngModel)]="patientCancellationFee.duration" />
                <select cSelect class="duration-unit-select" name="feeDurationUnit"
                    [disabled]="!patientCancellationFee.isEnabled"
                    [(ngModel)]="patientCancellationFee.feeDurationUnit">
                    <option>Day</option>
                    <option>Hour</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Save Action -->
    <div class="form-actions" *appRoleScope="'patient-payment-role'; requireModify: true">
        <button cButton class="save-btn" type="button" (click)="save()">
            <svg cIcon name="cilDollar" class="save-icon"></svg>
            Save Fee Settings
        </button>
    </div>
  </form>
</div>
