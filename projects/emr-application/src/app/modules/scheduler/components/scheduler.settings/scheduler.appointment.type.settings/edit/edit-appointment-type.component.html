<div class="appt-type-form-container">
    <!-- Validation Alert -->
    <div class="validation-alert" *ngIf="isValidForm">
        <svg cIcon name="cilBan" class="alert-icon"></svg>
        <span>Please fill in all the required fields before saving.</span>
    </div>

    <form [formGroup]="appointmentTypeEditForm">
        <div class="form-grid">
            <!-- Name -->
            <div class="form-field">
                <label class="field-label">
                    Name <span class="required-mark">*</span>
                </label>
                <input cFormControl placeholder="Enter appointment type name"
                    formControlName="appointment-name" maxlength="60" input-trimmer
                    [ngClass]="{'field-invalid': appointmentTypeEditForm.get('appointment-name')?.invalid
                    && appointmentTypeEditForm.get('appointment-name')?.touched}" />
            </div>

            <!-- Color -->
            <div class="form-field color-field">
                <label class="field-label">
                    Color <span class="required-mark">*</span>
                </label>
                <div class="color-picker-row">
                    <input class="color-swatch-input"
                        [(colorPicker)]="color" formControlName="appointment-color"
                        [style.background]="appointmentTypeEditForm.get('appointment-color').value"
                        (cpSliderDragStart)="onCahngeColor('cpSliderDragStart', $event)" readonly />
                    <span class="color-hex">{{ appointmentTypeEditForm.get('appointment-color').value || 'Select' }}</span>
                </div>
            </div>

            <!-- Font Color -->
            <div class="form-field color-field">
                <label class="field-label">Font Color</label>
                <div class="color-picker-row">
                    <input class="color-swatch-input"
                        [(colorPicker)]="color" formControlName="appointment-font-color"
                        [style.background]="appointmentTypeEditForm.get('appointment-font-color').value"
                        (cpSliderDragStart)="onCahngeFontColor('cpSliderDragStart', $event)" readonly />
                    <span class="color-hex">{{ appointmentTypeEditForm.get('appointment-font-color').value || '#000000' }}</span>
                </div>
            </div>
        </div>

        <!-- Save Action -->
        <div class="form-actions">
            <button cButton class="save-btn" (click)="update()">
                <svg cIcon name="cilPen" class="save-icon"></svg>
                Update
            </button>
        </div>
    </form>
</div>
