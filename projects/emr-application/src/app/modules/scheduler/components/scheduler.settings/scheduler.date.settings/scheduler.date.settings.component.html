<div class="date-settings-container">
    <!-- Validation Alert -->
    <div class="validation-alert" *ngIf="isValidForm">
        <svg cIcon name="cilBan" class="alert-icon"></svg>
        <span>Please fill in all the required fields before saving.</span>
    </div>

    <form [formGroup]="settingsForm">
        <div class="form-grid">
            <!-- Week Start -->
            <div class="form-field">
                <label class="field-label">
                    Week starts on <span class="required-mark">*</span>
                </label>
                <select cSelect formControlName="start-week"
                    [ngClass]="{'field-invalid': settingsForm.get('start-week')?.invalid && settingsForm.get('start-week')?.touched}">
                    <option value="null" disabled>Select day</option>
                    <option *ngFor="let day of startweek" [value]="day">{{ day }}</option>
                </select>
                <span class="field-error"
                    *ngIf="settingsForm.get('start-week')?.errors?.['required'] && (settingsForm.get('start-week')?.dirty || settingsForm.get('start-week')?.touched)">
                    Start week is required
                </span>
            </div>

            <!-- Time Interval -->
            <div class="form-field">
                <label class="field-label">
                    Time Interval <span class="required-mark">*</span>
                </label>
                <select cSelect formControlName="time-interval"
                    [ngClass]="{'field-invalid': settingsForm.get('time-interval')?.invalid && settingsForm.get('time-interval')?.touched}">
                    <option value="null" disabled>Select interval</option>
                    <option *ngFor="let interval of timeInterval" [value]="interval">{{ interval }}</option>
                </select>
                <span class="field-error"
                    *ngIf="settingsForm.get('time-interval')?.errors?.['required'] && (settingsForm.get('time-interval')?.dirty || settingsForm.get('time-interval')?.touched)">
                    Time interval is required
                </span>
            </div>

            <!-- Start of Day -->
            <div class="form-field">
                <label class="field-label">
                    Start of day <span class="required-mark">*</span>
                </label>
                <select cSelect formControlName="start-of-day"
                    [ngClass]="{'field-invalid': settingsForm.get('start-of-day')?.invalid && settingsForm.get('start-of-day')?.touched}">
                    <option value="null" disabled>Select hour</option>
                    <option *ngFor="let hour of dayHours" [value]="hour">{{ hour }}</option>
                </select>
                <span class="field-error"
                    *ngIf="settingsForm.get('start-of-day')?.errors?.['required'] && (settingsForm.get('start-of-day')?.dirty || settingsForm.get('start-of-day')?.touched)">
                    Start of day is required
                </span>
            </div>

            <!-- End of Day -->
            <div class="form-field">
                <label class="field-label">
                    End of day <span class="required-mark">*</span>
                </label>
                <select cSelect formControlName="end-of-day"
                    [ngClass]="{'field-invalid': settingsForm.get('end-of-day')?.invalid && settingsForm.get('end-of-day')?.touched}">
                    <option value="null" disabled>Select hour</option>
                    <option *ngFor="let hour of dayHours" [value]="hour">{{ hour }}</option>
                </select>
                <span class="field-error"
                    *ngIf="settingsForm.get('end-of-day')?.errors?.['required'] && (settingsForm.get('end-of-day')?.dirty || settingsForm.get('end-of-day')?.touched)">
                    End of day is required
                </span>
            </div>

            <!-- Appointment Duration -->
            <div class="form-field">
                <label class="field-label">
                    Appointment Duration <span class="required-mark">*</span>
                </label>
                <select cSelect formControlName="appointment-duration"
                    [ngClass]="{'field-invalid': settingsForm.get('appointment-duration')?.invalid && settingsForm.get('appointment-duration')?.touched}">
                    <option value="null" disabled>Select duration</option>
                    <option *ngFor="let duration of appointmentDuration" [value]="duration">{{ duration }}</option>
                </select>
                <span class="field-error"
                    *ngIf="settingsForm.get('appointment-duration')?.errors?.['required'] && (settingsForm.get('appointment-duration')?.dirty || settingsForm.get('appointment-duration')?.touched)">
                    Appointment duration is required
                </span>
            </div>
        </div>

        <!-- Save Action -->
        <div class="form-actions">
            <button cButton class="save-btn" (click)="save()">
                <svg cIcon name="cilSettings" class="save-icon"></svg>
                Save Settings
            </button>
        </div>
    </form>
</div>
