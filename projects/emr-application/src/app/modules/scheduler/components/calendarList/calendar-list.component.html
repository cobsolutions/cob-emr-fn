<!-- Page Header -->
<div class="page-header">
  <div class="page-header-content">
    <div class="page-title-section">
      <h2 class="page-title">
        <svg cIcon name="cilCalendar" class="page-icon"></svg>
        Calendars
      </h2>
      <p class="page-subtitle">Manage and configure clinic calendars</p>
    </div>
    <div class="header-actions">
      <button cButton class="action-btn save-btn" (click)="updateCalendar()">
        <svg cIcon name="cilSave" class="btn-icon"></svg>
        Save Changes
      </button>
      <button cButton class="action-btn create-btn" (click)="openAddCalendarModal()">
        <svg cIcon name="cilPlus" class="btn-icon"></svg>
        Add Calendar
      </button>
    </div>
  </div>
</div>

<!-- Search Panel -->
<div class="search-panel">
  <div class="search-panel-header" (click)="searchCollapsed = !searchCollapsed">
    <div class="search-header-title">
      <svg cIcon name="cilSearch" class="search-icon"></svg>
      <span>Search Filters</span>
    </div>
    <svg cIcon name="cilChevronBottom" class="collapse-icon" [class.expanded]="!searchCollapsed"></svg>
  </div>
  <div class="search-panel-body" *ngIf="!searchCollapsed">
    <form cForm>
      <div class="search-grid">
        <!-- Name Filter -->
        <div class="search-field">
          <label class="field-label">Calendar Name</label>
          <div class="input-with-action">
            <input cFormControl placeholder="Search by name" [(ngModel)]="searchCriteria.name" name="sc_pname" />
            <button class="clear-btn" (click)="clearFilter('name')" cTooltip="Clear" cTooltipPlacement="top">
              <svg cIcon name="cilX" class="clear-icon"></svg>
            </button>
          </div>
        </div>

        <!-- Date Range Filter -->
        <div class="search-field">
          <label class="field-label">Created Date Range</label>
          <div class="date-range-row">
            <div class="input-with-action date-input">
              <input type="date" cFormControl
                [ngModel]="searchCriteria.searchStartDate | date:'yyyy-MM-dd'"
                (ngModelChange)="searchCriteria.searchStartDate = $event" name="dosStart_Date" id="dosStart_Date" />
            </div>
            <span class="date-separator">to</span>
            <div class="input-with-action date-input">
              <input type="date" cFormControl
                [ngModel]="searchCriteria.searchEndDate | date:'yyyy-MM-dd'"
                (ngModelChange)="searchCriteria.searchEndDate = $event" name="dosEnd_Date" />
            </div>
            <button class="clear-btn" (click)="clearFilter('createdAt')" cTooltip="Clear dates" cTooltipPlacement="top">
              <svg cIcon name="cilX" class="clear-icon"></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="search-actions">
        <button cButton class="search-btn" (click)="search()">
          <svg cIcon name="cilSearch" class="btn-icon"></svg>
          Search
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Table -->
<ng-container *ngIf="props$ | async as props" fluid="true">
  <div class="table-card">
    <c-smart-table [columnSorter]="{resetable: true }" [columns]="columns" [items]="(calendars$ | async) ?? []"
      #calendarsItems [itemsPerPage]="props.itemsPerPage" (itemsPerPageChange)="handleItemsPerPageChange($event)"
      [itemsPerPageOptions]="[5,10,20]" [itemsPerPageSelect]="true"
      [tableProps]="{ hover: true, striped: false, small: false }" [columnFilterValue]="props.columnFilterValue ?? []"
      [sorterValue]="props.sorterValue" [tableBodyProps]="{ align: 'middle' }"
      (sorterValueChange)="handleSorterValueChange($event)" header>
      <ng-template cTemplateId="tableData" let-columnName="columnName" let-item="item" let-tdContent="tdContent">
        <td>
          <ng-container [ngSwitch]="columnName">
            <ng-container *ngSwitchCase="'isPublic'" class="py-2">
              <div class="checkbox-cell">
                <input cFormCheckInput [(ngModel)]="item.isPublic" type="checkbox"
                  [disabled]="!(item.createdBy === loggedInUserUUID)" />
              </div>
            </ng-container>
            <ng-container *ngSwitchCase="'attached'" class="py-2">
              <div class="checkbox-cell">
                <input cFormCheckInput [(ngModel)]="item.isAttach" type="checkbox" />
              </div>
            </ng-container>
            <ng-container *ngSwitchCase="'actions'" class="py-2">
              <button cButton class="edit-btn" (click)="openEditCalendarModal(item)" cTooltip="Edit" cTooltipPlacement="left">
                <svg cIcon name="cilPen" class="edit-icon"></svg>
              </button>
            </ng-container>
            <ng-container *ngSwitchDefault>
              {{ tdContent }}
            </ng-container>
          </ng-container>
        </td>
      </ng-template>
    </c-smart-table>
    <div class="pagination-wrapper" *ngIf="props.totalPages">
      <c-smart-pagination [activePage]="props.activePage"
        (activePageChange)="handleActivePageChange($event)" [pages]="props.totalPages"></c-smart-pagination>
    </div>
  </div>
</ng-container>

<!-- Create Calendar Modal -->
<c-modal id="createCalendar" [visible]="createCalendarVisibility" size="lg" backdrop="static" scrollable>
  <c-modal-header class="modal-header-custom">
    <h3 cModalTitle class="modal-title-custom">
      <svg cIcon name="cilPlus" class="modal-title-icon"></svg>
      Create Calendar
    </h3>
    <button (click)="toggleCreate()" cButtonClose></button>
  </c-modal-header>
  <c-modal-body>
    <create-calendar *ngIf="createCalendarVisibility"
      (changeCreateVisibility)="changeCreateVisibility($event)" [clinicId]="clinicId"></create-calendar>
  </c-modal-body>
</c-modal>

<!-- Edit Calendar Modal -->
<c-modal id="editClinic" [visible]="editCalendarVisibility" size="sm" backdrop="static">
  <c-modal-header class="modal-header-custom">
    <h3 cModalTitle class="modal-title-custom">
      <svg cIcon name="cilPen" class="modal-title-icon"></svg>
      Edit Calendar
    </h3>
    <button (click)="toggleEdit()" cButtonClose></button>
  </c-modal-header>
  <c-modal-body>
    <edit-calendar *ngIf="editCalendarVisibility" [calendar]="selectedCalednar"
      (changeVisibility)="changeEditVisibility($event)"></edit-calendar>
  </c-modal-body>
</c-modal>
