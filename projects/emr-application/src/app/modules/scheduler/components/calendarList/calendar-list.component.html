<ngx-spinner></ngx-spinner>
<c-row>
    <!--Search Panel-->
    <c-col xs="12">
        <c-card class="mb-4">
            <c-card-header ngPreserveWhitespaces>
                <strong>Calendar Search</strong> <small>From Calendars list</small>
            </c-card-header>
            <c-card-body>
                <p class="text-medium-emphasis small">
                    The Abiltiy to filter the Calendar list
                </p>
                <form cForm>
                    <c-row>
                        <c-col class="mb-2" xs="12">
                            <c-input-group sizing="sm">
                                <span cInputGroupText id="basic-addon1">Name</span>
                                <input aria-describedby="basic-addon1" aria-label="Username" cFormControl
                                    placeholder="Name" sizing="sm" [(ngModel)]="searchCriteria.name" name="sc_pname" />
                                <button cButton size="sm" variant="outline" (click)="clearFilter('name')">
                                    <svg cIcon name="cilFilter" title="cilFilterX"></svg>
                                </button>
                            </c-input-group>
                        </c-col>
                        <c-col xs="12">
                            <c-input-group class="mb-3" sizing="sm">
                                <span cInputGroupText id="basic-addon1">Create</span>
                                <input type="date" cFormControl sizing="sm"
                                    [ngModel]="searchCriteria.searchStartDate | date:'yyyy-MM-dd'"
                                    (ngModelChange)="searchCriteria.searchStartDate = $event" name="dosStart_Date"
                                    id="dosStart_Date" #dosEnd_Date>
                                <input type="date" cFormControl
                                    [ngModel]="searchCriteria.searchEndDate | date:'yyyy-MM-dd'" sizing="sm"
                                    (ngModelChange)="searchCriteria.searchEndDate = $event" name="dosEnd_Date"
                                    #dosEnd_Date>
                                <button cButton size="sm" variant="outline" (click)="clearFilter('createdAt')">
                                    <svg cIcon name="cilFilter" title="cilFilterX"></svg>
                                </button>
                            </c-input-group>
                        </c-col>
                        <c-col xs="12" class="text-center">
                            <button cButton class="me-1" color="primary" (click)="search()">
                                Search
                            </button>
                        </c-col>
                    </c-row>
                </form>
            </c-card-body>
        </c-card>
    </c-col>
    <c-col xs="12">
        <c-button-group aria-label="Button outlined group with nested dropdown" role="group">
            <button cButton color="primary" variant="outline" (click)="openAddCalendarModal()">Add Calendar</button>
            <button cButton color="primary" variant="outline" (click)="updateCalendar()">Save</button>
        </c-button-group>
    </c-col>
</c-row>
<ng-container *ngIf="props$ | async as props" fluid="true">
    <c-smart-table [columnSorter]="{resetable: true }" [columns]="columns" [items]="(calendars$ | async) ?? []"
        #calendarsItems [itemsPerPage]="props.itemsPerPage" (itemsPerPageChange)="handleItemsPerPageChange($event)"
        [itemsPerPageOptions]="[5,10,20]" [itemsPerPageSelect]="true"
        [tableProps]="{ hover: true, striped: true, small:true }" [columnFilterValue]="props.columnFilterValue?? []"
        [sorterValue]="props.sorterValue" [tableBodyProps]="{ align: 'middle' }"
        (sorterValueChange)="handleSorterValueChange($event)" header>
        <ng-template cTemplateId="tableData" let-columnName="columnName" let-item="item" let-tdContent="tdContent">
            <td>
                <ng-container [ngSwitch]="columnName">
                    <ng-container *ngSwitchCase="'isPublic'" class="py-2">
                        <input cFormCheckInput sizing="sm" [(ngModel)]="item.isPublic" type="checkbox"
                            [disabled]="!(item.createdBy === loggedInUserUUID)">
                    </ng-container>
                    <ng-container *ngSwitchCase="'attached'" class="py-2">
                        <input cFormCheckInput sizing="sm" [(ngModel)]="item.isAttach" type="checkbox">
                    </ng-container>
                    <ng-container *ngSwitchCase="'actions'" class="py-2">
                        <div class="btn-group" role="group" aria-label="Basic example">
                            <button cButton variant="outline" size="sm" (click)="openEditCalendarModal(item)">
                                <svg cIcon name="cilPen"></svg>
                            </button>
                        </div>
                    </ng-container>
                    <ng-container *ngSwitchDefault>
                        {{tdContent}}
                    </ng-container>
                </ng-container>
            </td>
        </ng-template>
    </c-smart-table>
    <c-smart-pagination *ngIf="props.totalPages" [activePage]="props.activePage"
        (activePageChange)="handleActivePageChange($event)" [pages]="props.totalPages"></c-smart-pagination>
</ng-container>

<c-modal id="createCalendar" [visible]="createCalendarVisibility" size="lg" backdrop="static" scrollable>
    <c-modal-header>
        <h2>Create Calendar</h2>
        <button (click)="toggleCreate()" cButtonClose></button>
    </c-modal-header>
    <c-modal-body>
        <create-calendar *ngIf="createCalendarVisibility"
            (changeCreateVisibility)="changeCreateVisibility($event)" [clinicId]="clinicId"></create-calendar>
    </c-modal-body>
</c-modal>
<c-modal id="editClinic" [visible]="editCalendarVisibility" size="sm" backdrop="static">
    <c-modal-header>
        <h3 cModalTitle>Edit Calendar</h3>
        <button (click)="toggleEdit()" cButtonClose></button>
    </c-modal-header>
    <c-modal-body>
        <edit-calendar *ngIf="editCalendarVisibility" [calendar]="selectedCalednar"
            (changeVisibility)="changeEditVisibility($event)"></edit-calendar>
    </c-modal-body>
</c-modal>
