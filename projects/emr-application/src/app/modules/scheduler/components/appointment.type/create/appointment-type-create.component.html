<div class="appt-create-container">
    <div class="form-grid">
        <!-- Type Name -->
        <div class="form-field name-field">
            <label class="field-label">Type Name</label>
            <input cFormControl id="companyname" name="appname" placeholder="Enter appointment type name"
                [(ngModel)]="appointmentType.name" />
        </div>

        <!-- Color Picker -->
        <div class="form-field color-field">
            <label class="field-label">Color</label>
            <div class="color-picker-row">
                <input class="color-swatch-input"
                    [style.background]="appointmentType.color"
                    [(colorPicker)]="color1"
                    (cpSliderDragStart)="onEventLog('cpSliderDragStart', $event)" readonly />
                <span class="color-hex">{{ appointmentType.color }}</span>
            </div>
        </div>
    </div>
</div>
