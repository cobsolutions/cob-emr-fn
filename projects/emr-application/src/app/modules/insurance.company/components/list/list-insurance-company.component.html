<ngx-spinner type="ball-scale-multiple"></ngx-spinner>
<c-row>
  <c-col xs="12" class="mb-2">
    <h1>Insurance Company</h1>
  </c-col>
</c-row>
<hr />
<div class="d-grid gap-2 d-md-flex justify-content-md-end">
  <button cButton color="primary" class="me-md-2" variant="outline" (click)="create()">Create Insurance Company</button>
</div>
<ng-container *ngIf="props$ | async as props" fluid="true">
  <c-smart-table [columnSorter]="{resetable: true }" [columns]="columns" [items]="(insuranceCompany$ | async) ?? []"
    [itemsPerPage]="props.itemsPerPage" (itemsPerPageChange)="handleItemsPerPageChange($event)"
    [itemsPerPageOptions]="[5,10,20]" [itemsPerPageSelect]="true"
    [tableProps]="{ hover: true, striped: true, responsive: true , small:true }"
    [columnFilterValue]="props.columnFilterValue?? []" [sorterValue]="props.sorterValue"
    [tableBodyProps]="{ align: 'middle' }" (sorterValueChange)="handleSorterValueChange($event)" header>
    <ng-template cTemplateId="tableData" let-columnName="columnName" let-item="item" let-tdContent="tdContent">
      <td>
        <ng-container [ngSwitch]="columnName">
          <ng-container *ngSwitchCase="'actions'" class="py-2">
            <div class="btn-group" role="group" aria-label="Basic example">
              <button cButton variant="outline" (click)="remove(item)" size="sm">
                <svg cIcon name="cilTrash"></svg>
              </button>
              <button cButton variant="outline" size="sm" (click)="edit(item)">
                <svg cIcon name="cilPen"></svg>
              </button>
            </div>
          </ng-container>
          <ng-container *ngSwitchDefault>
            {{tdContent}}
          </ng-container>
        </ng-container>
      </td>
    </ng-template>
  </c-smart-table>
  <c-smart-pagination *ngIf="props.totalPages" [activePage]="props.activePage"
    (activePageChange)="handleActivePageChange($event)" [pages]="props.totalPages"></c-smart-pagination>
</ng-container>
<ng-container *ngIf="errorMessage$ | async as errorMessage">
  <hr>
  <c-alert>{{errorMessage}}</c-alert>
</ng-container>
<c-modal id="editInsuranceCompany" [visible]="editInsuranceCompanyVisibility" size="xl">
  <c-modal-header>
    <h3 cModalTitle>Edit InsuranceCompany</h3>
    <button (click)="toggleEdiInsuranceCompany()" cButtonClose></button>
  </c-modal-header>
  <c-modal-body>
    <app-edit-insurance-company *ngIf="editInsuranceCompanyVisibility"
      [insuranceCompany]="selectedInsuranceCompany" (changeVisibility)="changeFacilityVisibility($event)"></app-edit-insurance-company>
  </c-modal-body>
</c-modal>
