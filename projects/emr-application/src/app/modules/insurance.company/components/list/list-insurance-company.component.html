<ngx-spinner type="ball-scale-multiple"></ngx-spinner>

<!-- Page Header Section -->
<div class="page-header">
  <div class="page-header-content">
    <div class="page-title-section">
      <h2 class="page-title">
        <svg cIcon name="cilBuilding" class="page-icon"></svg>
        Insurance Company List
      </h2>
      <p class="page-subtitle">Browse, edit, and manage insurance companies</p>
    </div>
  </div>
</div>

<!-- Insurance Company Table Card -->
<ng-container *ngIf="props$ | async as props">
  <c-card class="insurance-card">
    <div class="card-header-custom">
      <div class="card-header-title">
        <svg cIcon name="cilList" class="card-icon"></svg>
        <span>All Insurance Companies</span>
      </div>
      <span class="card-badge">
        {{ (insuranceCompany$ | async)?.length || 0 }} Records
      </span>
    </div>
    <c-card-body class="card-body-custom">
      <c-smart-table
        [columnSorter]="{ resetable: true }"
        [columns]="columns"
        [items]="(insuranceCompany$ | async) ?? []"
        [itemsPerPage]="props.itemsPerPage"
        (itemsPerPageChange)="handleItemsPerPageChange($event)"
        [itemsPerPageOptions]="[5,10,20]"
        [itemsPerPageSelect]="true"
        [tableProps]="{ hover: true, striped: true, small: true, borderless: true }"
        [columnFilterValue]="props.columnFilterValue ?? []"
        [sorterValue]="props.sorterValue"
        [tableBodyProps]="{ align: 'middle' }"
        (sorterValueChange)="handleSorterValueChange($event)"
        header>
        <ng-template cTemplateId="tableData" let-columnName="columnName" let-item="item" let-tdContent="tdContent">
          <td>
            <ng-container [ngSwitch]="columnName">
              <ng-container *ngSwitchCase="'name'">
                <span class="company-name">
                  <svg cIcon name="cilBuilding" class="company-icon"></svg>
                  {{item.name}}
                </span>
              </ng-container>
              <ng-container *ngSwitchCase="'insuranceType'">
                <span class="type-badge">
                  {{item.insuranceType}}
                </span>
              </ng-container>
              <ng-container *ngSwitchCase="'phone'">
                <span class="contact-info">
                  <svg cIcon name="cilPhone" class="contact-icon"></svg>
                  {{item.phone || '-'}}
                </span>
              </ng-container>
              <ng-container *ngSwitchCase="'fax'">
                <span class="contact-info">
                  <svg cIcon name="cilFax" class="contact-icon"></svg>
                  {{item.fax || '-'}}
                </span>
              </ng-container>
              <ng-container *ngSwitchCase="'actions'">
                <div class="action-buttons">
                  <button *appRoleScope="'insurance-company-role'; requireModify: true" cButton class="action-btn-delete" (click)="remove(item)" title="Delete">
                    <svg cIcon name="cilTrash" class="action-icon"></svg>
                  </button>
                  <button *appRoleScope="'insurance-company-role'; requireModify: true" cButton class="action-btn-edit" (click)="edit(item)" title="Edit">
                    <svg cIcon name="cilPen" class="action-icon"></svg>
                  </button>
                </div>
              </ng-container>

              <ng-container *ngSwitchDefault>
                {{ tdContent }}
              </ng-container>
            </ng-container>
          </td>
        </ng-template>
      </c-smart-table>

      <!-- Pagination -->
      <div class="pagination-container">
        <c-smart-pagination
          *ngIf="props.totalPages"
          [activePage]="props.activePage"
          (activePageChange)="handleActivePageChange($event)"
          [pages]="props.totalPages">
        </c-smart-pagination>
      </div>
    </c-card-body>
  </c-card>
</ng-container>

<!-- Error Alert -->
<ng-container *ngIf="errorMessage$ | async as errorMessage">
  <div class="error-alert">
    <svg cIcon name="cilWarning" class="error-icon"></svg>
    <span>{{ errorMessage }}</span>
  </div>
</ng-container>

<!-- Edit Insurance Company Modal -->
<c-modal id="editInsuranceCompany" [visible]="editInsuranceCompanyVisibility" size="xl" [backdrop]="'static'">
  <c-modal-header class="modal-header-custom">
    <h3 cModalTitle class="modal-title-custom">
      <svg cIcon name="cilBuilding" class="modal-icon"></svg>
      Edit Insurance Company
    </h3>
    <button (click)="toggleEdiInsuranceCompany()" class="modal-close-btn">
      <svg cIcon name="cilX"></svg>
    </button>
  </c-modal-header>
  <c-modal-body class="modal-body-custom">
    <app-edit-insurance-company
      *ngIf="editInsuranceCompanyVisibility"
      [insuranceCompany]="selectedInsuranceCompany"
      (changeVisibility)="changeFacilityVisibility($event)">
    </app-edit-insurance-company>
  </c-modal-body>
</c-modal>

<!-- Floating Action Button -->
<button *appRoleScope="'insurance-company-role'; requireModify: true" class="fab-button" (click)="create()" title="Create New Insurance Company">
  <svg cIcon name="cilPlus" class="fab-icon"></svg>
</button>
