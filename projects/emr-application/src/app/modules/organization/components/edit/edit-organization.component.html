<!-- Page Header -->
<div class="page-header">
  <div class="page-header-content">
    <div class="page-title-section">
      <h2 class="page-title">
        <svg cIcon name="cilBuilding" class="page-icon"></svg>
        Organization Details
      </h2>
      <p class="page-subtitle">View organization information</p>
    </div>
    <div class="header-badge">
      <span class="view-badge">
        <svg cIcon name="cilLockLocked" class="badge-icon"></svg>
        View Only
      </span>
    </div>
  </div>
</div>

<!-- Main Layout with Progress Sidebar -->
<div class="page-layout">
  <!-- Progress Indicator Sidebar -->
  <aside class="progress-sidebar">
    <div class="progress-sidebar-content">
      <div class="progress-title">Sections</div>
      <ul class="progress-list">
        <li class="progress-item completed">
          <span class="progress-indicator">
            <svg cIcon name="cilCheckCircle" class="indicator-icon"></svg>
          </span>
          <span class="progress-label">Essential Info</span>
        </li>
        <li class="progress-item completed">
          <span class="progress-indicator">
            <svg cIcon name="cilCheckCircle" class="indicator-icon"></svg>
          </span>
          <span class="progress-label">Address</span>
        </li>
        <li class="progress-item completed">
          <span class="progress-indicator">
            <svg cIcon name="cilCheckCircle" class="indicator-icon"></svg>
          </span>
          <span class="progress-label">Clinics</span>
        </li>
      </ul>
    </div>
  </aside>

  <!-- Main Form Content -->
  <div class="form-container">
    <!-- Essential Information -->
    <c-card class="section-card" id="section-essential">
      <div class="card-header-custom">
        <div class="card-header-title">
          <svg cIcon name="cilNotes" class="card-icon"></svg>
          <span>Essential Information</span>
        </div>
        <span class="card-status valid">
          <svg cIcon name="cilCheckCircle" class="status-icon"></svg>
          Complete
        </span>
      </div>
      <c-card-body class="card-body-custom">
        <form cForm #organizationForm="ngForm">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="organizationname">Organization Name</label>
              <div class="readonly-field">
                <svg cIcon name="cilBuilding" class="field-icon"></svg>
                <input cFormControl id="organizationname" name="organization name"
                  placeholder="Organization Name" required [(ngModel)]="organization!.name"
                  #organizationname="ngModel" readonly />
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="dba">DBA</label>
              <div class="readonly-field">
                <svg cIcon name="cilBadge" class="field-icon"></svg>
                <input cFormControl id="dba" name="dba" placeholder="Organization DBA"
                  required [(ngModel)]="organization!.dba" #dba="ngModel" readonly />
              </div>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="groupNPI">Group NPI</label>
              <div class="readonly-field">
                <svg cIcon name="cilFingerprint" class="field-icon"></svg>
                <input cFormControl id="groupNPI" name="Group-NPI" placeholder="Organization Group NPI"
                  required [(ngModel)]="organization!.groupNPI" #groupNPI="ngModel" readonly />
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="taxID">Tax ID</label>
              <div class="readonly-field">
                <svg cIcon name="cilLibrary" class="field-icon"></svg>
                <input cFormControl id="taxID" name="tax-ID" placeholder="Organization Tax ID"
                  required [(ngModel)]="organization!.taxID" #taxID="ngModel" readonly />
              </div>
            </div>
          </div>
        </form>
      </c-card-body>
    </c-card>

    <!-- Address Information -->
    <c-card class="section-card" id="section-address">
      <div class="card-header-custom">
        <div class="card-header-title">
          <svg cIcon name="cilLocationPin" class="card-icon"></svg>
          <span>Address Information</span>
        </div>
        <span class="card-status valid">
          <svg cIcon name="cilCheckCircle" class="status-icon"></svg>
          Complete
        </span>
      </div>
      <c-card-body class="card-body-custom">
        <app-single-address #organizationBillingAddress [address]="organization.billingAddress"
          [submitted]="submitted"></app-single-address>
      </c-card-body>
    </c-card>

    <!-- Clinic Information -->
    <c-card class="section-card" id="section-clinics">
      <div class="card-header-custom">
        <div class="card-header-title">
          <svg cIcon name="cilHospital" class="card-icon"></svg>
          <span>Clinic Information</span>
        </div>
        <span class="card-badge-count" *ngIf="organization?.clinics?.length">
          {{ organization.clinics.length }} {{ organization.clinics.length === 1 ? 'Clinic' : 'Clinics' }}
        </span>
      </div>
      <c-card-body class="card-body-custom">
        <app-organization-clinics-creation
          [selectedclinics]="organization.clinics"></app-organization-clinics-creation>
      </c-card-body>
    </c-card>
  </div>
</div>
