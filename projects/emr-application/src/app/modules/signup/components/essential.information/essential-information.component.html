<div [formGroup]="form" class="mt-3">

    <div formGroupName="essential">
        <!-- Name-->
        <c-input-group class="mb-1" sizing="sm">
            <span cInputGroupText style="width: 120px;">Name*</span>
            <input class="form-control" placeholder formControlName="orgname">
            <div *ngIf="!this.form.get('essential').get('orgname')?.valid && 
                    (this.form.get('essential').get('orgname')?.dirty ||this.form.get('essential').get('orgname')?.touched)"
                class="text-danger">
                Organization Name is required
            </div>
        </c-input-group>

        <!--DBA-->
        <c-input-group class="mb-1" sizing="sm">
            <span cInputGroupText style="width: 120px;">DBA*</span>
            <input class="form-control" id="dba" name="dba" placeholder formControlName="dba" class="form-control" />
            <div *ngIf="!this.form.get('essential').get('dba')?.valid && 
                            (this.form.get('essential').get('dba')?.dirty ||this.form.get('essential').get('dba')?.touched)"
                class="text-danger">
                Organization dba is required
            </div>
        </c-input-group>

        <c-input-group class="mb-1" sizing="sm">
            <span cInputGroupText style="width: 120px;">Group NPI*</span>
            <input id="groupNPI" name="groupNPI" placeholder formControlName="groupNPI" sizing="sm"
                class="form-control" />
            <div *ngIf="!this.form.get('essential').get('groupNPI')?.valid && 
                            (this.form.get('essential').get('groupNPI')?.dirty ||this.form.get('essential').get('groupNPI')?.touched)"
                class="text-danger">
                group NPI is required
            </div>
        </c-input-group>

        <!--taxID-->
        <c-input-group class="mb-1" sizing="sm">
            <span cInputGroupText style="width: 120px;">Tax ID*</span>
            <input id="taxID" name="taxID" placeholder formControlName="taxID" sizing="sm"
                class="form-control" />
            <div *ngIf="!this.form.get('essential').get('taxID')?.valid && 
                (this.form.get('essential').get('taxID')?.dirty ||this.form.get('essential').get('taxID')?.touched)"
                class="text-danger">
                tax ID is required
            </div>
        </c-input-group>

        <!--First Address-->
        <c-input-group class="mb-1" sizing="sm">
            <span cInputGroupText style="width: 120px;">First Address*</span>
            <input id="fAddress" name="fAddress" placeholder formControlName="firstAddress" class="form-control" />
            <div *ngIf="!this.form.get('essential').get('firstAddress')?.valid && 
                (this.form.get('essential').get('firstAddress')?.dirty ||this.form.get('essential').get('firstAddress')?.touched)"
                class="text-danger">
                First Address is required
            </div>
        </c-input-group>

        <!-- second Address-->
        <c-input-group class="mb-1" sizing="sm">
            <span cInputGroupText style="width: 120px;">Second Address*</span>
            <input id="sAddress" name="sAddress" placeholder formControlName="secondAddress" class="form-control" />
        </c-input-group>

        <!-- State-->
        <c-input-group class="mb-1" sizing="sm">
            <span cInputGroupText style="width: 120px;">State*</span>
            <input id="state" name="state" placeholder formControlName="state" class="form-control" />
            <div *ngIf="!this.form.get('essential').get('state')?.valid && 
                (this.form.get('essential').get('state')?.dirty ||this.form.get('essential').get('state')?.touched)"
                class="text-danger">
                state is required
            </div>
        </c-input-group>

        <!--city-->
        <c-input-group class="mb-1" sizing="sm">
            <span cInputGroupText style="width: 120px;">City*</span>
            <input id="city" name="city" placeholder formControlName="city" class="form-control" />
            <div *ngIf="!this.form.get('essential').get('city')?.valid && 
                (this.form.get('essential').get('city')?.dirty ||this.form.get('essential').get('city')?.touched)"
                class="text-danger">
                city is required
            </div>
        </c-input-group>

        <!--zipCode-->
        <c-input-group class="mb-1" sizing="sm">
            <span cInputGroupText style="width: 120px;">ZipCode*</span>
            <input zipcode id="zipcode" name="zipcode" placeholder formControlName="zipCode" class="form-control" />
            <div *ngIf="!this.form.get('essential').get('zipCode')?.valid && 
                            (this.form.get('essential').get('zipCode')?.dirty ||this.form.get('essential').get('zipCode')?.touched)"
                class="text-danger">
            </div>
        </c-input-group>
    </div>
    <div  class="mt-3">
        <button cButton matStepperNext variant="outline" size="sm" style="width: 5%;" type="submit"
            [disabled]="!form.get('essential').valid">Next</button>
    </div>
</div>
