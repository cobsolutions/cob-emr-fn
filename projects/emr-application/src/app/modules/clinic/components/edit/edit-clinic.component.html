<ngx-spinner></ngx-spinner>
<c-container fluid>
    <form cForm #clinicEditForm="ngForm" (ngSubmit)="update()" (change)="resetError()" readonly-form [componentRole]="componentRole">
        <c-row class="justify-content-center">
            <c-col class="col">
                <c-card class="mb-3 ustify-content-center">
                    <c-card-header>
                        <h5>Clinic Name</h5>
                    </c-card-header>
                    <c-card-body>
                        <small
                            *ngIf="validateForm   && (clinicname.errors) || (clinicname.invalid && (clinicname.dirty || clinicname.touched))"
                            class="form-text text-danger">
                            Clinic Name is required
                        </small>
                        <c-input-group class="mb-3">
                            <input autoComplete="name" cFormControl id="clinicname" name="clinicname" sizing="sm"
                                placeholder="Enter Clinic Name" required
                                [ngClass]="{'is-invalid': clinicname.invalid && (clinicname.dirty || clinicname.touched)}"
                                [(ngModel)]="clinic.name" #clinicname="ngModel" />
                        </c-input-group>
                    </c-card-body>
                </c-card>
            </c-col>
        </c-row>
        <c-row class="justify-content-center">
            <small *ngIf="!validAddress" class="form-text text-danger">
                Clinic Address is required
            </small>
            <app-single-address [address]="clinic?.address" [componentRole]="componentRole"></app-single-address>
        </c-row>
        <div class="d-grid gap-2 col-2 mx-auto mb-5">
            <button cButton color="primary" variant="outline" type="submit" dispaly-input [componentRole]="componentRole">
                Update
            </button>
        </div>
    </form>
</c-container>
