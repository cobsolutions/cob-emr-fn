<ngx-spinner></ngx-spinner>

<!-- Page Header -->
<div class="page-header">
  <div class="page-header-content">
    <div class="page-title-section">
      <h2 class="page-title">
        <svg cIcon name="cilPencil" class="page-icon"></svg>
        Edit Clinic
      </h2>
      <p class="page-subtitle">Update clinic information below</p>
    </div>
    <div class="header-progress">
      <span class="progress-badge" [ngClass]="{'valid': valid, 'invalid': !valid}">
        <svg cIcon [name]="valid ? 'cilCheckCircle' : 'cilWarning'" class="progress-icon"></svg>
        {{ valid ? 'Ready to Submit' : 'Incomplete' }}
      </span>
    </div>
  </div>
</div>

<!-- Main Layout with Progress Sidebar -->
<div class="page-layout">
  <!-- Progress Indicator Sidebar -->
  <aside class="progress-sidebar">
    <div class="progress-sidebar-content">
      <div class="progress-title">Sections</div>
      <ul class="progress-list">
        <li class="progress-item" [ngClass]="{'completed': isValidClinicName}">
          <span class="progress-indicator">
            <svg cIcon [name]="isValidClinicName ? 'cilCheckCircle' : 'cilCircle'" class="indicator-icon"></svg>
          </span>
          <span class="progress-label">Clinic Name</span>
        </li>
        <li class="progress-item" [ngClass]="{'completed': isValidClinicAddress}">
          <span class="progress-indicator">
            <svg cIcon [name]="isValidClinicAddress ? 'cilCheckCircle' : 'cilCircle'" class="indicator-icon"></svg>
          </span>
          <span class="progress-label">Address</span>
        </li>
      </ul>
    </div>
  </aside>

  <!-- Main Form Content -->
  <div class="form-container">
    <form cForm #clinicEditForm="ngForm" (ngSubmit)="update()" (change)="resetError()" readonly-form [componentRole]="componentRole">
      <!-- Clinic Name Section -->
      <c-card class="section-card" id="section-clinic-name">
        <div class="card-header-custom" [ngClass]="{'invalid': !isValidClinicName}">
          <div class="card-header-title">
            <svg cIcon name="cilBuilding" class="card-icon"></svg>
            <span>Clinic Name</span>
          </div>
          <span class="card-status" *ngIf="!isValidClinicName">
            <svg cIcon name="cilWarning" class="status-icon"></svg>
            Required
          </span>
          <span class="card-status valid" *ngIf="isValidClinicName">
            <svg cIcon name="cilCheckCircle" class="status-icon"></svg>
            Complete
          </span>
        </div>
        <c-card-body class="card-body-custom">
          <div class="form-group">
            <label class="form-label" for="clinicname">Clinic Name <span class="required-marker">*</span></label>
            <c-input-group>
              <input autoComplete="name" cFormControl id="clinicname" name="clinicname"
                placeholder="Enter Clinic Name" required
                [ngClass]="{'is-invalid': clinicname.invalid && (clinicname.dirty || clinicname.touched)}"
                [(ngModel)]="clinic.name" #clinicname="ngModel" />
            </c-input-group>
            <small *ngIf="validateForm && (clinicname.errors) || (clinicname.invalid && (clinicname.dirty || clinicname.touched))"
              class="form-text text-danger">
              Clinic Name is required
            </small>
          </div>
        </c-card-body>
      </c-card>

      <!-- Address Information Section -->
      <c-card class="section-card" id="section-address">
        <div class="card-header-custom" [ngClass]="{'invalid': !isValidClinicAddress}">
          <div class="card-header-title">
            <svg cIcon name="cilLocationPin" class="card-icon"></svg>
            <span>Address Information</span>
          </div>
          <span class="card-status" *ngIf="!isValidClinicAddress">
            <svg cIcon name="cilWarning" class="status-icon"></svg>
            Required
          </span>
          <span class="card-status valid" *ngIf="isValidClinicAddress">
            <svg cIcon name="cilCheckCircle" class="status-icon"></svg>
            Complete
          </span>
        </div>
        <c-card-body class="card-body-custom">
          <ng-container *ngIf="!validAddress && validateForm">
            <c-alert color="warning" class="address-alert">
              <svg cIcon name="cilWarning" class="alert-icon"></svg>
              Clinic Address is required
            </c-alert>
          </ng-container>
          <app-single-address [address]="clinic?.address" [componentRole]="componentRole"></app-single-address>
        </c-card-body>
      </c-card>

      <!-- Action Section -->
      <div class="action-section">
        <button
          cButton
          class="create-btn"
          [ngClass]="{'disabled': !valid}"
          type="submit"
          dispaly-input
          [componentRole]="componentRole">
          <svg cIcon name="cilPencil" class="btn-icon"></svg>
          Update Clinic
        </button>
      </div>
    </form>
  </div>
</div>
