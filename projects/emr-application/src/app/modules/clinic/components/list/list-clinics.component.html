<ngx-spinner type="ball-scale-multiple"></ngx-spinner>

<!-- Page Header Section -->
<div class="page-header">
  <div class="page-header-content">
    <div class="page-title-section">
      <h2 class="page-title">
        <svg cIcon name="cilHospital" class="page-icon"></svg>
        Clinic List
      </h2>
      <p class="page-subtitle">Browse, edit, and manage clinic records</p>
    </div>
  </div>
</div>

<!-- Clinic Table Card -->
<ng-container *ngIf="props$ | async as props">
  <c-card class="clinic-card">
    <div class="card-header-custom">
      <div class="card-header-title">
        <svg cIcon name="cilList" class="card-icon"></svg>
        <span>All Clinics</span>
      </div>
      <span class="card-badge">
        {{ (clinics$ | async)?.length || 0 }} Records
      </span>
    </div>
    <c-card-body class="card-body-custom">
      <c-smart-table
        [columnSorter]="{ resetable: true }"
        [columns]="columns"
        [items]="(clinics$ | async) ?? []"
        [itemsPerPage]="props.itemsPerPage"
        (itemsPerPageChange)="handleItemsPerPageChange($event)"
        [itemsPerPageOptions]="[5,10,20]"
        [itemsPerPageSelect]="true"
        [tableProps]="{ hover: true, striped: true, small: true, borderless: true }"
        [columnFilterValue]="props.columnFilterValue ?? []"
        [sorterValue]="props.sorterValue"
        [tableBodyProps]="{ align: 'middle' }"
        (sorterValueChange)="handleSorterValueChange($event)"
        header>
        <ng-template cTemplateId="tableData" let-columnName="columnName" let-item="item" let-tdContent="tdContent">
          <td>
            <ng-container [ngSwitch]="columnName">
              <ng-container *ngSwitchCase="'name'">
                <span class="clinic-name">
                  <svg cIcon name="cilHospital" class="clinic-icon"></svg>
                  {{item.name}}
                </span>
              </ng-container>
              <ng-container *ngSwitchCase="'address'">
                <span class="address-info">
                  <svg cIcon name="cilLocationPin" class="address-icon"></svg>
                  {{constructAddress(tdContent)}}
                </span>
              </ng-container>
              <ng-container *ngSwitchCase="'actions'">
                <div class="action-buttons">
                  <button cButton class="action-btn-edit" (click)="edit(item)" title="Edit Clinic">
                    <svg cIcon name="cilPen" class="action-icon"></svg>
                  </button>
                  <button cButton class="action-btn-delete" (click)="remove(item)" title="Delete Clinic"
                    dispaly-input [componentRole]="componentRole">
                    <svg cIcon name="cilTrash" class="action-icon"></svg>
                  </button>
                </div>
              </ng-container>
              <ng-container *ngSwitchDefault>
                {{ tdContent }}
              </ng-container>
            </ng-container>
          </td>
        </ng-template>
      </c-smart-table>

      <!-- Pagination -->
      <div class="pagination-container">
        <c-smart-pagination
          *ngIf="props.totalPages"
          [activePage]="props.activePage"
          (activePageChange)="handleActivePageChange($event)"
          [pages]="props.totalPages">
        </c-smart-pagination>
      </div>
    </c-card-body>
  </c-card>
</ng-container>

<!-- Error Alert -->
<ng-container *ngIf="errorMessage$ | async as errorMessage">
  <div class="error-alert">
    <svg cIcon name="cilWarning" class="error-icon"></svg>
    <span>{{ errorMessage }}</span>
  </div>
</ng-container>

<!-- Edit Clinic Modal -->
<c-modal id="editClinic" [visible]="editClinicVisibility" size="xl" [backdrop]="'static'">
  <c-modal-header class="modal-header-custom">
    <h3 cModalTitle class="modal-title-custom">
      <svg cIcon name="cilHospital" class="modal-icon"></svg>
      Edit Clinic
    </h3>
    <button (click)="toggleEditClinic()" class="modal-close-btn">
      <svg cIcon name="cilX"></svg>
    </button>
  </c-modal-header>
  <c-modal-body class="modal-body-custom">
    <app-edit-clinic
      *ngIf="editClinicVisibility"
      [clinic]="selectedClinic"
      (changeVisibility)="changeFacilityVisibility($event)">
    </app-edit-clinic>
  </c-modal-body>
</c-modal>

<!-- Floating Action Button -->
<button class="fab-button" (click)="create()" dispaly-input [componentRole]="componentRole" title="Create New Clinic">
  <svg cIcon name="cilPlus" class="fab-icon"></svg>
</button>
